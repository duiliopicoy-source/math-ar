<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Álgebra | Hacker Mode</title>

  <!-- A-Frame 1.2.0 estable -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.2.0/dist/aframe.min.js"></script>
  <!-- AR.js compatible con A-Frame 1.2.0 -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

    :root {
      --neon: #00ff88;
      --neon-dim: #00cc66;
      --neon-glow: rgba(0, 255, 136, 0.3);
      --dark: #000d00;
      --panel: rgba(0, 18, 0, 0.92);
      --border: #00ff88;
      --wrong: #ff2244;
      --correct: #00ffcc;
      --btn-bg: rgba(0, 255, 136, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon);
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    /* ── SCANLINES overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.12) 2px,
        rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ── HUD superior ── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(0,10,0,0.75);
      border-bottom: 1px solid var(--neon-dim);
      z-index: 500;
      backdrop-filter: blur(4px);
    }

    #hud .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--neon);
    }

    #hud .counter {
      font-size: 12px;
      color: var(--neon-dim);
      letter-spacing: 2px;
    }

    #score-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon);
    }

    /* ── Panel de ejercicio (UI flotante sobre la vista) ── */
    #exercise-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 14px 16px 24px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      z-index: 500;
      backdrop-filter: blur(6px);
      transition: opacity 0.4s ease;
    }

    #exercise-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #marker-hint {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 18px;
      text-align: center;
      background: rgba(0,10,0,0.85);
      border-top: 1px solid var(--neon-dim);
      z-index: 500;
      font-size: 14px;
      color: var(--neon-dim);
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    #question-label {
      font-size: 11px;
      color: var(--neon-dim);
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    #question-text {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(16px, 4vw, 22px);
      color: var(--neon);
      text-shadow: 0 0 12px var(--neon);
      margin-bottom: 14px;
      min-height: 50px;
      display: flex;
      align-items: center;
    }

    #feedback {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      min-height: 22px;
      margin-bottom: 10px;
      letter-spacing: 2px;
      transition: color 0.2s;
    }

    #feedback.correct { color: var(--correct); text-shadow: 0 0 10px var(--correct); }
    #feedback.wrong   { color: var(--wrong);   text-shadow: 0 0 10px var(--wrong); }

    #options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .opt-btn {
      background: var(--btn-bg);
      border: 1px solid var(--neon-dim);
      color: var(--neon);
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      padding: 14px 8px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .opt-btn:active {
      transform: scale(0.96);
    }

    .opt-btn:hover, .opt-btn:focus {
      background: rgba(0, 255, 136, 0.18);
      border-color: var(--neon);
      box-shadow: 0 0 14px var(--neon-glow);
      outline: none;
    }

    .opt-btn.correct-flash {
      background: rgba(0, 255, 204, 0.25);
      border-color: var(--correct);
      box-shadow: 0 0 20px rgba(0,255,204,0.5);
      color: var(--correct);
    }

    .opt-btn.wrong-flash {
      background: rgba(255, 34, 68, 0.2);
      border-color: var(--wrong);
      box-shadow: 0 0 14px rgba(255,34,68,0.4);
      color: var(--wrong);
    }

    /* ── Pantalla de fin ── */
    #end-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,8,0,0.96);
      z-index: 600;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 30px;
    }

    #end-screen.visible { display: flex; }

    #end-screen h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(24px, 7vw, 42px);
      color: var(--neon);
      text-shadow: 0 0 24px var(--neon), 0 0 60px var(--neon-glow);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 20px var(--neon); }
      to   { text-shadow: 0 0 40px var(--neon), 0 0 80px var(--neon-glow); }
    }

    #end-screen p {
      font-size: 16px;
      color: var(--neon-dim);
      letter-spacing: 2px;
    }

    #restart-btn {
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      padding: 14px 32px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 10px;
      box-shadow: 0 0 16px var(--neon-glow);
      transition: background 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    #restart-btn:active {
      background: rgba(0,255,136,0.15);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    /* ── A-Frame ocupa todo el fondo ── */
    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 0;
    }

    .a-enter-vr { display: none !important; }
    .a-loader-title { display: none !important; }
  </style>
</head>
<body>

  <!-- ══════════════ HUD ══════════════ -->
  <div id="hud">
    <span class="logo">▶ AR_ALGEBRA</span>
    <span class="counter" id="progress-counter">EJ 1 / 10</span>
    <span id="score-badge">✦ 0</span>
  </div>

  <!-- ══════════════ HINT (visible cuando no hay marcador) ══════════════ -->
  <div id="marker-hint">
    [ APUNTA LA CÁMARA AL MARCADOR HIRO ]
  </div>

  <!-- ══════════════ PANEL DE EJERCICIO ══════════════ -->
  <div id="exercise-panel" class="hidden">
    <div id="question-label">// RESUELVE:</div>
    <div id="question-text">Cargando...</div>
    <div id="feedback"></div>
    <div id="options-grid"></div>
  </div>

  <!-- ══════════════ PANTALLA FINAL ══════════════ -->
  <div id="end-screen">
    <h1>MISIÓN COMPLETA</h1>
    <p id="final-score">ACIERTOS: 0 / 10</p>
    <p style="font-size:12px; color:#00aa44; letter-spacing:1px;">Sistema de álgebra terminado exitosamente.</p>
    <button id="restart-btn" onclick="restartApp()">[ REINICIAR ]</button>
  </div>

  <!-- ══════════════ A-FRAME SCENE ══════════════ -->
  <!--
    Configuración probada para evitar pantalla negra en Android:
    - logarithmicDepthBuffer: false  → evita glitch en GPU móvil
    - precision: medium              → equilibrio rendimiento/calidad
    - arjs sourceType: webcam        → fuerza cámara trasera
  -->
  <a-scene
    embedded
    renderer="antialias: true; alpha: true; precision: medium; logarithmicDepthBuffer: false;"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
          facingMode: environment;
          debugUIEnabled: false;
          detectionMode: mono_and_matrix;
          matrixCodeType: 3x3;"
    gesture-detector
  >
    <a-assets></a-assets>

    <!-- Marcador Hiro -->
    <a-marker
      preset="hiro"
      id="hiro-marker"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <!-- Plano base neón bajo el texto 3D -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="2.4" height="1.2"
        color="#000d00"
        opacity="0.82"
        material="shader: flat;"
      ></a-plane>

      <!-- Borde neón decorativo -->
      <a-plane
        position="0 0.005 0"
        rotation="-90 0 0"
        width="2.5" height="1.3"
        color="#00ff88"
        opacity="0.18"
        material="shader: flat;"
      ></a-plane>

      <!-- Texto del ejercicio en AR -->
      <a-text
        id="ar-exercise-text"
        value="AR ALGEBRA"
        align="center"
        color="#00ff88"
        width="2.2"
        position="0 0.55 0"
        rotation="-90 0 0"
        font="https://cdn.aframe.io/fonts/ShareTechMono-Regular.fnt"
        wrap-count="28"
      ></a-text>

      <!-- Indicador de estado en AR -->
      <a-text
        id="ar-status-text"
        value="▶ Responde abajo"
        align="center"
        color="#00cc66"
        width="1.8"
        position="0 0.15 0"
        rotation="-90 0 0"
        font="https://cdn.aframe.io/fonts/ShareTechMono-Regular.fnt"
        wrap-count="32"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- ══════════════ LÓGICA DE LA APP ══════════════ -->
  <script>
    // ── Ejercicios de álgebra ──────────────────────────────
    const exercises = [
      {
        q: "Si 3x = 21, ¿cuánto vale x?",
        options: ["5", "7", "9", "6"],
        answer: "7"
      },
      {
        q: "Resuelve: 2x + 4 = 14",
        options: ["3", "5", "4", "6"],
        answer: "5"
      },
      {
        q: "¿Qué valor de x satisface x² = 49?",
        options: ["6", "8", "7", "5"],
        answer: "7"
      },
      {
        q: "Si x/4 = 3, entonces x = ?",
        options: ["9", "16", "12", "7"],
        answer: "12"
      },
      {
        q: "Factoriza: x² - 9 = ?",
        options: ["(x-3)(x+3)", "(x-3)²", "(x+9)(x-1)", "(x+3)²"],
        answer: "(x-3)(x+3)"
      },
      {
        q: "Si 5x - 3 = 22, ¿cuánto vale x?",
        options: ["4", "5", "6", "3"],
        answer: "5"
      },
      {
        q: "¿Cuál es la pendiente de y = 3x + 7?",
        options: ["7", "3", "-3", "1"],
        answer: "3"
      },
      {
        q: "Resuelve: 4(x - 2) = 16",
        options: ["4", "6", "5", "8"],
        answer: "6"
      },
      {
        q: "Si x² + 2x = 0, una solución es x = ?",
        options: ["1", "-1", "-2", "2"],
        answer: "-2"
      },
      {
        q: "¿Cuánto vale x en: 2x/3 = 8?",
        options: ["10", "12", "14", "16"],
        answer: "12"
      }
    ];

    // ── Estado ────────────────────────────────────────────
    let currentIdx = 0;
    let score = 0;
    let markerVisible = false;
    let answered = false;

    // ── Referencias DOM ───────────────────────────────────
    const panel        = document.getElementById('exercise-panel');
    const hint         = document.getElementById('marker-hint');
    const questionText = document.getElementById('question-text');
    const feedbackEl   = document.getElementById('feedback');
    const optionsGrid  = document.getElementById('options-grid');
    const scoreBadge   = document.getElementById('score-badge');
    const progressEl   = document.getElementById('progress-counter');
    const endScreen    = document.getElementById('end-screen');
    const finalScore   = document.getElementById('final-score');
    const arText       = document.getElementById('ar-exercise-text');
    const arStatus     = document.getElementById('ar-status-text');

    // ── Cargar ejercicio ──────────────────────────────────
    function loadExercise(idx) {
      const ex = exercises[idx];
      answered = false;
      feedbackEl.textContent = '';
      feedbackEl.className = '';
      progressEl.textContent = `EJ ${idx + 1} / 10`;
      questionText.textContent = ex.q;

      // Actualizar texto en AR
      if (arText) arText.setAttribute('value', ex.q);
      if (arStatus) arStatus.setAttribute('value', `▶ Responde abajo`);

      // Generar botones
      optionsGrid.innerHTML = '';
      ex.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleAnswer(opt, btn));
        optionsGrid.appendChild(btn);
      });
    }

    // ── Manejar respuesta ─────────────────────────────────
    function handleAnswer(selected, btn) {
      if (answered) return;
      answered = true;

      const ex = exercises[currentIdx];
      const allBtns = optionsGrid.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selected === ex.answer) {
        score++;
        btn.classList.add('correct-flash');
        feedbackEl.textContent = '✦ ¡CORRECTO!';
        feedbackEl.className = 'correct';
        scoreBadge.textContent = `✦ ${score}`;
        if (arStatus) arStatus.setAttribute('value', '✦ ¡CORRECTO!');

        // Avanzar automáticamente
        setTimeout(() => nextExercise(), 1500);
      } else {
        btn.classList.add('wrong-flash');
        feedbackEl.textContent = `✗ ERROR — Era: ${ex.answer}`;
        feedbackEl.className = 'wrong';
        if (arStatus) arStatus.setAttribute('value', `Respuesta: ${ex.answer}`);

        // Resaltar correcta
        allBtns.forEach(b => {
          if (b.textContent === ex.answer) b.classList.add('correct-flash');
        });
        setTimeout(() => nextExercise(), 2200);
      }
    }

    // ── Siguiente ejercicio ───────────────────────────────
    function nextExercise() {
      currentIdx++;
      if (currentIdx >= exercises.length) {
        showEndScreen();
      } else {
        loadExercise(currentIdx);
      }
    }

    // ── Pantalla final ────────────────────────────────────
    function showEndScreen() {
      panel.classList.add('hidden');
      hint.style.display = 'none';
      endScreen.classList.add('visible');
      finalScore.textContent = `ACIERTOS: ${score} / 10`;
    }

    function restartApp() {
      currentIdx = 0;
      score = 0;
      scoreBadge.textContent = '✦ 0';
      endScreen.classList.remove('visible');
      hint.style.display = '';
      loadExercise(0);
    }

    // ── Eventos del marcador AR ───────────────────────────
    function initMarkerEvents() {
      const marker = document.getElementById('hiro-marker');
      if (!marker) {
        setTimeout(initMarkerEvents, 500);
        return;
      }

      marker.addEventListener('markerFound', () => {
        markerVisible = true;
        hint.style.display = 'none';
        if (currentIdx < exercises.length) {
          panel.classList.remove('hidden');
        }
      });

      marker.addEventListener('markerLost', () => {
        markerVisible = false;
        panel.classList.add('hidden');
        if (currentIdx < exercises.length) {
          hint.style.display = '';
        }
      });
    }

    // ── Init ──────────────────────────────────────────────
    loadExercise(0);

    // Esperar a que A-Frame esté listo
    document.querySelector('a-scene').addEventListener('loaded', () => {
      initMarkerEvents();
    });

    // Fallback si ya cargó
    if (document.querySelector('a-scene').hasLoaded) {
      initMarkerEvents();
    }
  </script>
</body>
</html>

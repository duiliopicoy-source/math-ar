<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            font-family: 'Courier New', Courier, monospace;
            color: #1f2833;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Pantalla de Terminal / Consola inicial */
        #terminal-screen {
            background-color: #0d0d11;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            max-width: 450px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .system-text {
            color: #66fcf1;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .status-text {
            color: #c5a3ff;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Botón de desencriptar al estilo Cyberpunk */
        #decrypt-btn {
            background: transparent;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 4px;
            display: block;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #decrypt-btn:hover {
            background-color: #ff4d6d;
            color: #000;
            box-shadow: 0 0 15px #ff4d6d;
            transform: scale(1.02);
        }

        /* Contenedor del Corazón */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none; /* Se activa por JS */
        }

        /* Cada uno de los "I Love You" individuales */
        .heart-text {
            position: absolute;
            color: #ff4d6d;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            animation: appear 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 8px rgba(255, 77, 109, 0.6);
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            50% {
                opacity: 0.8;
            }
            100% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Texto flotante central grande */
        #main-title {
            position: absolute;
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            z-index: 5;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div class="system-text">[System] Initializing heart_PROTOCOL_v2.0...</div>
        <div class="status-text">&gt; One encrypted package found for you. <span class="blink">_</span></div>
        <button id="decrypt-btn">🔓 Decrypt Message</button>
    </div>

    <h1 id="main-title">Love you.</h1>

    <div id="heart-container"></div>

    <script>
        const decryptBtn = document.getElementById('decrypt-btn');
        const terminalScreen = document.getElementById('terminal-screen');
        const heartContainer = document.getElementById('heart-container');
        const mainTitle = document.getElementById('main-title');

        // Configuración del algoritmo matemático del corazón
        const TOTAL_TEXTS = 320; // Cantidad de "I Love You" que forman la silueta
        const TEXT_PHRASE = "I love you";

        decryptBtn.addEventListener('click', () => {
            // 1. Desvanecer la pantalla de carga de la consola
            terminalScreen.style.opacity = '0';
            terminalScreen.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                terminalScreen.style.display = 'none';
                // 2. Mostrar el contenedor del corazón y el título principal
                heartContainer.style.display = 'block';
                mainTitle.style.style = 'block';
                mainTitle.style.opacity = '1';
                
                // 3. Generar la dispersión geométrica
                generateHeart();
            }, 800);
        });

        function generateHeart() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Centros de coordenadas en pantalla
            const centerX = width / 2;
            const centerY = height / 2 - 30; // Un poco desplazado hacia arriba para equilibrar el diseño

            // Escala del corazón según el tamaño de la pantalla
            const scale = Math.min(width, height) * 0.022; 

            for (let i = 0; i < TOTAL_TEXTS; i++) {
                // Generamos un ángulo aleatorio t entre 0 y 2*PI
                // Usamos una distribución uniforme estructurada para rellenar la forma de manera balanceada
                const t = Math.PI * 2 * (i / TOTAL_TEXTS); 
                
                // --- ECUACIÓN MATEMÁTICA DEL CORAZÓN (Cardioide paramétrica) ---
                // x = 16 * sin^3(t)
                // y = 13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t)
                const xMod = 16 * Math.pow(Math.sin(t), 3);
                const yMod = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                // Traducimos a coordenadas de píxeles en pantalla (Y se invierte debido a la matriz del navegador)
                const posX = centerX + xMod * scale;
                const posY = centerY - yMod * scale;

                // Crear el elemento HTML
                const wordElement = document.createElement('span');
                wordElement.className = 'heart-text';
                wordElement.innerText = TEXT_PHRASE;

                // Posicionamiento absoluto
                wordElement.style.left = `${posX}px`;
                wordElement.style.top = `${posY}px`;

                // Añadimos pequeñas variaciones aleatorias para que se vea más orgánico e imperfecto (como el vídeo)
                const randomDelay = Math.random() * 1.5; // Los textos irán apareciendo en tiempos distintos
                const randomOffset = (Math.random() - 0.5) * 15; // Pequeño desfase en PX
                
                wordElement.style.animationDelay = `${randomDelay}s`;
                wordElement.style.left = `${posX + randomOffset}px`;
                wordElement.style.top = `${posY + randomOffset}px`;

                // Ajustamos tamaños aleatorios para dar sensación de profundidad tridimensional
                const fontSize = Math.floor(Math.random() * 6) + 10; // Entre 10px y 16px
                wordElement.style.fontSize = `${fontSize}px`;

                // Variaciones sutiles de color (Rojos, carmines, rosas fosforescentes)
                const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#ff0a54'];
                wordElement.style.color = colors[Math.floor(Math.random() * colors.length)];

                // Insertamos en el DOM
                heartContainer.appendChild(wordElement);
            }
        }

        // Reajustar el diseño si se redimensiona la pantalla
        window.addEventListener('resize', () => {
            if(heartContainer.style.display === 'block') {
                heartContainer.innerHTML = '';
                generateHeart();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>MathXR · Álgebra AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #00ff88;
      --green-dim:   #00bb55;
      --green-glow:  rgba(0,255,136,.5);
      --cyan:        #00e5ff;
      --red:         #ff2244;
      --red-glow:    rgba(255,34,68,.5);
      --yellow:      #ffe000;
      --panel-bg:    rgba(0,10,5,.84);
      --border:      rgba(0,255,136,.3);
      --text:        #cffde4;
      --mono:        'Share Tech Mono', monospace;
      --display:     'Orbitron', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: var(--mono);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── CAMERA ── */
    #cam {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── SCANLINES ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,255,100,.015) 3px, rgba(0,255,100,.015) 4px
      );
    }

    /* ── VIGNETTE ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 50%, rgba(0,0,0,.8) 100%);
    }

    /* ── FLASH ── */
    #flash {
      position: fixed; inset: 0; z-index: 200;
      pointer-events: none; opacity: 0;
    }
    #flash.green { background: radial-gradient(ellipse at center, rgba(0,255,136,.5) 0%, transparent 70%); }
    #flash.red   { background: radial-gradient(ellipse at center, rgba(255,34,68,.5)  0%, transparent 70%); }
    #flash.go    { animation: flashPop .6s ease-out forwards; }
    @keyframes flashPop { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ── PARTICLES ── */
    #particles {
      position: fixed; inset: 0; z-index: 199;
      pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: particleFly .8s ease-out forwards;
    }
    @keyframes particleFly {
      from { opacity: 1; transform: translate(0,0) scale(1); }
      to   { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* ── STATUS BAR ── */
    #status {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 50; pointer-events: none;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 18px 10px;
      background: linear-gradient(180deg, rgba(0,8,3,.92) 0%, transparent 100%);
    }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .stat-label {
      font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--green-dim);
    }
    .stat-val {
      font-family: var(--display); font-size: 22px; font-weight: 700;
      color: var(--green); text-shadow: 0 0 14px var(--green-glow);
      line-height: 1;
    }
    #streak-val { color: var(--yellow); text-shadow: 0 0 14px rgba(255,224,0,.5); }

    /* progress pips */
    #pips { display: flex; gap: 5px; align-items: center; }
    .pip {
      width: 9px; height: 9px; border-radius: 50%;
      border: 1.5px solid rgba(0,255,136,.35);
      background: transparent;
      transition: background .3s, box-shadow .3s;
    }
    .pip.done   { background: var(--green); box-shadow: 0 0 7px var(--green); }
    .pip.active { background: var(--cyan);  box-shadow: 0 0 9px var(--cyan); border-color: var(--cyan); }

    /* ── HUD WRAPPER ── */
    #hud {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 14px 20px;
      gap: 14px;
      pointer-events: none;
    }

    /* ── EQUATION PANEL ── */
    #eq-panel {
      width: 100%; max-width: 440px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px 16px;
      position: relative;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 0 0 1px rgba(0,255,136,.06),
        0 0 36px rgba(0,255,136,.14),
        inset 0 1px 0 rgba(0,255,136,.18);
      animation: slideIn .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px) scale(.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* corner brackets */
    #eq-panel::before, #eq-panel::after {
      content: ''; position: absolute;
      width: 16px; height: 16px;
      border-color: var(--green); border-style: solid;
    }
    #eq-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 14px 0 0 0; }
    #eq-panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 14px 0; }

    .chip {
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--green-dim); margin-bottom: 10px; display: block;
    }
    .chip::before { content: '◈ '; color: var(--green); }

    #eq-number {
      position: absolute; top: 14px; right: 18px;
      font-size: 10px; letter-spacing: 2px;
      color: rgba(0,255,136,.4);
    }

    #eq-text {
      font-family: var(--display);
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      color: var(--green);
      text-align: center;
      text-shadow: 0 0 22px var(--green-glow), 0 0 50px rgba(0,255,136,.15);
      letter-spacing: 2px;
      padding: 8px 0 4px;
    }
    .eq-hint {
      text-align: center; font-size: 10px; letter-spacing: 4px;
      color: rgba(0,255,136,.38); text-transform: uppercase;
      margin-top: 8px;
    }
    .divider {
      width: 100%; height: 1px; margin: 14px 0;
      background: linear-gradient(90deg, transparent, rgba(0,255,136,.35), transparent);
    }

    /* ── ANSWER BUTTONS ── */
    #answers {
      width: 100%; max-width: 440px;
      display: grid; grid-template-columns: 1fr;
      gap: 10px;
      pointer-events: all;
    }
    .ans-btn {
      width: 100%;
      background: rgba(0,12,6,.78);
      border: 1px solid rgba(0,255,136,.28);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer;
      position: relative; overflow: hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: border-color .2s, transform .15s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .ans-btn:active { transform: scale(.97); }
    .ans-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,255,136,.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .ans-key {
      font-family: var(--display); font-size: 12px; font-weight: 700;
      color: var(--green-dim); letter-spacing: 2px;
      min-width: 28px;
    }
    .ans-val {
      font-family: var(--display); font-size: clamp(18px, 5vw, 24px);
      font-weight: 700; color: var(--text);
      text-shadow: 0 0 10px rgba(207,253,228,.3);
      letter-spacing: 1px;
    }
    .ripple-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: var(--green);
      transform: scaleX(0); transform-origin: left;
      transition: transform .3s;
    }
    .ans-btn:active .ripple-bar { transform: scaleX(1); }

    .ans-btn.correct {
      border-color: var(--green);
      background: rgba(0,255,136,.12);
      box-shadow: 0 0 20px rgba(0,255,136,.35), inset 0 0 20px rgba(0,255,136,.06);
    }
    .ans-btn.wrong {
      border-color: var(--red);
      background: rgba(255,34,68,.1);
      box-shadow: 0 0 16px rgba(255,34,68,.3);
    }
    .ans-btn.correct .ans-val { color: var(--green); text-shadow: 0 0 12px var(--green-glow); }
    .ans-btn.wrong   .ans-val { color: var(--red);   text-shadow: 0 0 12px var(--red-glow); }
    .ans-btn.disabled { pointer-events: none; opacity: .45; }

    /* ── RESULT BADGE ── */
    #result-badge {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(20px, 5.5vw, 30px);
      letter-spacing: 5px; text-transform: uppercase;
      padding: 12px 32px;
      border-radius: 10px;
      opacity: 0; transform: scale(.8);
      transition: opacity .3s cubic-bezier(.34,1.56,.64,1), transform .3s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    #result-badge.show { opacity: 1; transform: scale(1); }
    #result-badge.correct { color: var(--green); border: 1.5px solid var(--green); background: rgba(0,255,136,.1); text-shadow: 0 0 20px var(--green-glow); box-shadow: 0 0 30px rgba(0,255,136,.2); }
    #result-badge.wrong   { color: var(--red);   border: 1.5px solid var(--red);   background: rgba(255,34,68,.1); text-shadow: 0 0 20px var(--red-glow); }

    /* ── NEXT BUTTON ── */
    #next-btn {
      display: none; pointer-events: all;
      font-family: var(--display); font-size: 13px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase;
      color: #000; background: var(--green);
      border: none; border-radius: 8px;
      padding: 15px 40px; cursor: pointer;
      box-shadow: 0 0 20px var(--green-glow), 0 4px 20px rgba(0,0,0,.4);
      animation: pulseBtn 1.5s ease-in-out infinite;
    }
    @keyframes pulseBtn {
      0%,100% { box-shadow: 0 0 20px var(--green-glow), 0 4px 20px rgba(0,0,0,.4); }
      50%     { box-shadow: 0 0 40px var(--green), 0 4px 20px rgba(0,0,0,.4); }
    }
    #next-btn:active { transform: scale(.96); }

    /* ── FINISH SCREEN ── */
    #finish-screen {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,8,3,.97);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 32px; text-align: center;
    }
    #finish-screen.show { display: flex; }

    .finish-title {
      font-family: var(--display); font-size: clamp(32px,9vw,52px);
      font-weight: 900; color: var(--green);
      text-shadow: 0 0 40px var(--green-glow);
      letter-spacing: 4px; line-height: 1.15;
      animation: glitch 3s infinite;
    }
    @keyframes glitch {
      0%,95%,100% { text-shadow: 0 0 40px var(--green-glow); transform: none; }
      96% { transform: translateX(-3px); text-shadow: -3px 0 var(--cyan), 3px 0 var(--red); }
      97% { transform: translateX( 3px); text-shadow:  3px 0 var(--cyan),-3px 0 var(--red); }
      98% { transform: none; }
    }
    .finish-score {
      font-family: var(--display); font-size: clamp(52px,14vw,88px);
      font-weight: 900; color: var(--yellow);
      text-shadow: 0 0 30px rgba(255,224,0,.6);
    }
    .finish-sub {
      font-size: 11px; letter-spacing: 4px; color: rgba(0,255,136,.55);
      text-transform: uppercase; line-height: 2;
    }
    .restart-btn {
      margin-top: 8px;
      font-family: var(--display); font-size: 12px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase;
      color: #000; background: var(--green);
      border: none; border-radius: 8px;
      padding: 16px 44px; cursor: pointer;
      box-shadow: 0 0 24px var(--green-glow);
      pointer-events: all;
    }

    /* ── INTRO SCREEN ── */
    #intro {
      position: fixed; inset: 0; z-index: 400;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px; padding: 32px; text-align: center;
    }
    .intro-logo {
      font-family: var(--display); font-size: clamp(40px,12vw,68px);
      font-weight: 900; color: var(--green);
      text-shadow: 0 0 40px var(--green-glow), 0 0 80px rgba(0,255,136,.2);
      letter-spacing: 6px;
      animation: glitch 4s infinite;
    }
    .intro-tagline {
      font-size: 11px; letter-spacing: 4px; color: rgba(0,255,136,.5);
      text-transform: uppercase; line-height: 2;
    }
    .intro-line {
      width: 70px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }
    .intro-warn {
      font-size: 10px; letter-spacing: 2px;
      color: rgba(255,224,0,.7); text-transform: uppercase;
      padding: 10px 18px; border: 1px solid rgba(255,224,0,.22);
      border-radius: 6px; background: rgba(255,224,0,.04);
      line-height: 2; max-width: 320px;
    }
    .start-btn {
      pointer-events: all;
      font-family: var(--display); font-size: 14px; font-weight: 700;
      letter-spacing: 6px; text-transform: uppercase;
      color: var(--green); background: transparent;
      border: 2px solid var(--green); border-radius: 8px;
      padding: 16px 50px; cursor: pointer;
      box-shadow: 0 0 24px rgba(0,255,136,.25);
      transition: all .2s;
    }
    .start-btn:active {
      background: rgba(0,255,136,.12);
      box-shadow: 0 0 40px rgba(0,255,136,.5);
    }
    /* scanlines on intro */
    #intro::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,255,100,.018) 3px, rgba(0,255,100,.018) 4px
      );
    }
  </style>
</head>
<body>

<!-- CAMERA FEED -->
<video id="cam" autoplay playsinline muted></video>

<!-- FLASH -->
<div id="flash"></div>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- ═══ INTRO ═══ -->
<div id="intro">
  <div class="intro-logo">MATH XR</div>
  <div class="intro-line"></div>
  <div class="intro-tagline">
    Álgebra básica en<br>Realidad Aumentada
  </div>
  <div class="intro-warn">
    ⚠ Permite acceso a la CÁMARA<br>
    Requiere HTTPS (GitHub Pages ✓)<br>
    Recomendado: Chrome en Android
  </div>
  <button class="start-btn" id="start-btn">INICIAR</button>
</div>

<!-- ═══ STATUS BAR ═══ -->
<div id="status">
  <div class="stat">
    <span class="stat-label">Puntos</span>
    <span class="stat-val" id="score-val">000</span>
  </div>
  <div id="pips"></div>
  <div class="stat">
    <span class="stat-label">Racha</span>
    <span class="stat-val" id="streak-val">×0</span>
  </div>
</div>

<!-- ═══ HUD ═══ -->
<div id="hud">

  <div id="eq-panel">
    <span class="chip">ejercicio actual</span>
    <span id="eq-number">01/10</span>
    <div id="eq-text">Cargando...</div>
    <div class="eq-hint">Encuentra el valor de X</div>
    <div class="divider"></div>
  </div>

  <div id="answers">
    <button class="ans-btn" id="btn-0">
      <span class="ans-key">A</span>
      <span class="ans-val" id="val-0">—</span>
      <div class="ripple-bar"></div>
    </button>
    <button class="ans-btn" id="btn-1">
      <span class="ans-key">B</span>
      <span class="ans-val" id="val-1">—</span>
      <div class="ripple-bar"></div>
    </button>
    <button class="ans-btn" id="btn-2">
      <span class="ans-key">C</span>
      <span class="ans-val" id="val-2">—</span>
      <div class="ripple-bar"></div>
    </button>
  </div>

  <div id="result-badge"></div>
  <button id="next-btn">SIGUIENTE ▶</button>

</div>

<!-- ═══ FINISH ═══ -->
<div id="finish-screen">
  <div class="finish-title">¡NIVEL<br>COMPLETADO!</div>
  <div class="finish-score" id="final-score">000</div>
  <div class="finish-sub">
    puntos totales<br>
    <span id="final-streak"></span>
  </div>
  <button class="restart-btn" id="restart-btn">REINICIAR</button>
</div>

<script>
/* ══════════════════════════════════════════════
   EXERCISE BANK — 10 ejercicios de álgebra
══════════════════════════════════════════════ */
const EXERCISES = [
  { eq: '4x + 5 = 13',   answer: 2,  opts: [2,  5,  -1] },
  { eq: '2x - 4 = 10',   answer: 7,  opts: [3,  7,  10] },
  { eq: '3x + 6 = 18',   answer: 4,  opts: [4,  6,   2] },
  { eq: '5x - 10 = 15',  answer: 5,  opts: [5,  3,   8] },
  { eq: '6x + 2 = 20',   answer: 3,  opts: [3,  4,   6] },
  { eq: '2x + 8 = 16',   answer: 4,  opts: [4,  2,   6] },
  { eq: '7x - 7 = 14',   answer: 3,  opts: [3,  7,   2] },
  { eq: '4x + 12 = 28',  answer: 4,  opts: [4,  7,   3] },
  { eq: '9x - 9 = 27',   answer: 4,  opts: [4,  3,   9] },
  { eq: '3x + 3 = 21',   answer: 6,  opts: [6,  3,   9] },
];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let state = {
  current:     0,
  score:       0,
  streak:      0,
  bestStreak:  0,
  locked:      false,
  optOrder:    [],   // shuffled option indices for current exercise
};

/* ══════════════════════════════════════════════
   CAMERA — force rear
══════════════════════════════════════════════ */
async function startCamera() {
  const video = document.getElementById('cam');
  // Try rear camera first, fallback to any
  const constraints = [
    { video: { facingMode: { exact: 'environment' } }, audio: false },
    { video: { facingMode: 'environment'            }, audio: false },
    { video: true,                                     audio: false },
  ];
  for (const c of constraints) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(c);
      video.srcObject = stream;
      await video.play();
      return; // success
    } catch (_) { /* try next */ }
  }
  console.warn('No camera available');
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pad(n) { return String(n).padStart(3, '0'); }

/* ══════════════════════════════════════════════
   LOAD EXERCISE
══════════════════════════════════════════════ */
function loadExercise() {
  const ex = EXERCISES[state.current];
  state.locked  = false;
  state.optOrder = shuffle([0, 1, 2]);

  // Panel text
  document.getElementById('eq-text').textContent = ex.eq;
  document.getElementById('eq-number').textContent =
    String(state.current + 1).padStart(2, '0') + '/' + EXERCISES.length;

  // Buttons
  state.optOrder.forEach((optIdx, btnIdx) => {
    const btn = document.getElementById('btn-' + btnIdx);
    btn.className = 'ans-btn';
    document.getElementById('val-' + btnIdx).textContent = ex.opts[optIdx];
  });

  // Hide badge/next
  const badge = document.getElementById('result-badge');
  badge.className = '';
  badge.textContent = '';
  document.getElementById('next-btn').style.display = 'none';

  // Re-trigger panel animation
  const panel = document.getElementById('eq-panel');
  panel.style.animation = 'none';
  void panel.offsetWidth;
  panel.style.animation = 'slideIn .4s cubic-bezier(.34,1.56,.64,1) both';

  buildPips();
}

/* ══════════════════════════════════════════════
   PROGRESS PIPS
══════════════════════════════════════════════ */
function buildPips() {
  const container = document.getElementById('pips');
  container.innerHTML = '';
  EXERCISES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pip' +
      (i < state.current ? ' done' : i === state.current ? ' active' : '');
    container.appendChild(d);
  });
}

/* ══════════════════════════════════════════════
   CHECK ANSWER
══════════════════════════════════════════════ */
function checkAnswer(btnIdx) {
  if (state.locked) return;

  const ex         = EXERCISES[state.current];
  const optIdx     = state.optOrder[btnIdx];
  const chosenVal  = ex.opts[optIdx];
  const isCorrect  = chosenVal === ex.answer;

  state.locked = true;

  const btn   = document.getElementById('btn-' + btnIdx);
  const badge = document.getElementById('result-badge');

  if (isCorrect) {
    /* ── CORRECT ── */
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const multiplier = state.streak >= 3 ? 3 : state.streak >= 2 ? 2 : 1;
    state.score += 100 * multiplier;

    btn.classList.add('correct');
    badge.className = 'correct show';
    badge.textContent = state.streak >= 3
      ? '¡RACHA ×' + state.streak + '!'
      : '¡CORRECTO!';

    triggerFlash('green');
    spawnParticles(btn);
    updateHUD();

    // Auto-advance after 1.5 s
    setTimeout(nextExercise, 1500);

  } else {
    /* ── WRONG ── */
    state.streak = 0;

    btn.classList.add('wrong');
    badge.className = 'wrong show';
    badge.textContent = 'INCORRECTO';

    triggerFlash('red');
    updateHUD();

    // Allow retry on other buttons; disable this one
    setTimeout(() => {
      btn.classList.add('disabled');
      badge.className = '';
      state.locked = false;
      // Show "Siguiente" so player can skip if stuck
      document.getElementById('next-btn').style.display = 'block';
    }, 900);
  }
}

/* ══════════════════════════════════════════════
   NEXT EXERCISE
══════════════════════════════════════════════ */
function nextExercise() {
  state.current++;
  if (state.current >= EXERCISES.length) {
    showFinish();
    return;
  }
  loadExercise();
}

/* ══════════════════════════════════════════════
   FLASH
══════════════════════════════════════════════ */
function triggerFlash(color) {
  const el = document.getElementById('flash');
  el.className = color;
  void el.offsetWidth;
  el.classList.add('go');
  el.addEventListener('animationend', () => { el.className = ''; }, { once: true });
}

/* ══════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════ */
function spawnParticles(originEl) {
  const container = document.getElementById('particles');
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;

  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 18) * Math.PI * 2;
    const dist  = 60 + Math.random() * 90;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    p.style.background  = i % 3 === 0 ? 'var(--cyan)'  : 'var(--green)';
    p.style.boxShadow   = i % 3 === 0 ? '0 0 8px var(--cyan)' : '0 0 8px var(--green)';
    p.style.animationDuration = (.45 + Math.random() * .55) + 's';
    container.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

/* ══════════════════════════════════════════════
   HUD UPDATE
══════════════════════════════════════════════ */
function updateHUD() {
  document.getElementById('score-val').textContent  = pad(state.score);
  document.getElementById('streak-val').textContent = '×' + state.streak;
}

/* ══════════════════════════════════════════════
   FINISH SCREEN
══════════════════════════════════════════════ */
function showFinish() {
  document.getElementById('final-score').textContent  = pad(state.score);
  document.getElementById('final-streak').textContent = 'Mejor racha: ×' + state.bestStreak;
  document.getElementById('finish-screen').classList.add('show');
}

function restartGame() {
  state = { current: 0, score: 0, streak: 0, bestStreak: 0, locked: false, optOrder: [] };
  document.getElementById('finish-screen').classList.remove('show');
  updateHUD();
  loadExercise();
}

/* ══════════════════════════════════════════════
   WIRE UP BUTTONS
══════════════════════════════════════════════ */
document.getElementById('btn-0').addEventListener('click',   () => checkAnswer(0));
document.getElementById('btn-1').addEventListener('click',   () => checkAnswer(1));
document.getElementById('btn-2').addEventListener('click',   () => checkAnswer(2));
document.getElementById('next-btn').addEventListener('click', nextExercise);
document.getElementById('restart-btn').addEventListener('click', restartGame);

/* ══════════════════════════════════════════════
   START
══════════════════════════════════════════════ */
document.getElementById('start-btn').addEventListener('click', async () => {
  document.getElementById('intro').style.display = 'none';
  await startCamera();
  updateHUD();
  loadExercise();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            font-family: 'Courier New', Courier, monospace;
            color: #1f2833;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Pantalla de Terminal / Consola inicial */
        #terminal-screen {
            background-color: #0d0d11;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            max-width: 450px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .system-text {
            color: #66fcf1;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .status-text {
            color: #c5a3ff;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Botón estilo Cyberpunk */
        #decrypt-btn {
            background: transparent;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 4px;
            display: block;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #decrypt-btn:hover {
            background-color: #ff4d6d;
            color: #000;
            box-shadow: 0 0 15px #ff4d6d;
            transform: scale(1.02);
        }

        /* Contenedor del Corazón */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
        }

        /* Estilo sutil para los nombres flotantes */
        .heart-text {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            /* Animación suave de aparición y flotación lenta */
            animation: appear 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       slowFloat 5s ease-in-out infinite alternate;
            text-shadow: 0 0 8px rgba(255, 77, 109, 0.5);
        }

        /* Animación de entrada con escala elegante */
        @keyframes appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            100% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Flotación sutil e independiente */
        @keyframes slowFloat {
            0% {
                transform: translate(-50%, -50%) translate(0px, 0px);
            }
            50% {
                transform: translate(-50%, -50%) translate(var(--move-x), var(--move-y));
            }
            100% {
                transform: translate(-50%, -50%) translate(var(--move-x-end), var(--move-y-end));
            }
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div class="system-text">[System] Initializing heart_PROTOCOL_v2.0...</div>
        <div class="status-text">&gt; One encrypted package found for you. <span class="blink">_</span></div>
        <button id="decrypt-btn">🔓 Decrypt Message</button>
    </div>

    <div id="heart-container"></div>

    <script>
        const decryptBtn = document.getElementById('decrypt-btn');
        const terminalScreen = document.getElementById('terminal-screen');
        const heartContainer = document.getElementById('heart-container');

        // CANTIDAD REDUCIDA: Pocas palabras para evitar que se amontone todo
        const BORDER_COUNT = 90; // Silueta exterior fina
        const FILL_COUNT = 70;   // Interior espaciado y elegante

        const NAME_TEXT = "Ariana";

        decryptBtn.addEventListener('click', () => {
            terminalScreen.style.opacity = '0';
            terminalScreen.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                terminalScreen.style.display = 'none';
                heartContainer.style.display = 'block';
                generateMinimalHeart();
            }, 800);
        });

        // Fórmula matemática base del corazón
        function getHeartCoords(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x, y };
        }

        function createFloatingText(posX, posY, scaleFactor) {
            const wordElement = document.createElement('span');
            wordElement.className = 'heart-text';
            wordElement.innerText = NAME_TEXT;

            // Posicionamiento
            wordElement.style.left = `${posX}px`;
            wordElement.style.top = `${posY}px`;

            // Aparición escalonada para que no salgan todas al mismo tiempo
            const randomDelay = Math.random() * 3; 
            wordElement.style.animationDelay = `${randomDelay}s, ${randomDelay}s`;

            // Movimientos suaves y fluidos (desplazamientos cortos de máximo 15px)
            const mx = ((Math.random() - 0.5) * 15).toFixed(1);
            const my = ((Math.random() - 0.5) * 15).toFixed(1);
            const mxEnd = ((Math.random() - 0.5) * -15).toFixed(1);
            const myEnd = ((Math.random() - 0.5) * -15).toFixed(1);

            wordElement.style.setProperty('--move-x', `${mx}px`);
            wordElement.style.setProperty('--move-y', `${my}px`);
            wordElement.style.setProperty('--move-x-end', `${mxEnd}px`);
            wordElement.style.setProperty('--move-y-end', `${myEnd}px`);

            // Tamaño uniforme y legible, sutilmente más pequeños al interior
            const fontSize = Math.floor(12 + (scaleFactor * 3) + (Math.random() * 2));
            wordElement.style.fontSize = `${fontSize}px`;

            // Gama de colores rosa/rojo neón elegantes
            const colors = ['#ff4d6d', '#ff758f', '#ff0a54', '#ff477e', '#ff85a1'];
            wordElement.style.color = colors[Math.floor(Math.random() * colors.length)];

            heartContainer.appendChild(wordElement);
        }

        function generateMinimalHeart() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2 - 20;
            const baseScale = Math.min(width, height) * 0.022;

            // 1. Relleno interior espaciado (Ariana)
            for (let i = 0; i < FILL_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const coords = getHeartCoords(t);

                // El radio 'r' las distribuye hacia adentro sin amontonarse
                const r = Math.random() * 0.85; 
                
                const posX = centerX + coords.x * baseScale * r;
                const posY = centerY - coords.y * baseScale * r;

                createFloatingText(posX, posY, r);
            }

            // 2. Silueta exterior definida (Ariana)
            for (let i = 0; i < BORDER_COUNT; i++) {
                const t = Math.PI * 2 * (i / BORDER_COUNT);
                const coords = getHeartCoords(t);

                const posX = centerX + coords.x * baseScale;
                const posY = centerY - coords.y * baseScale;

                createFloatingText(posX, posY, 1.0);
            }
        }

        // Ajuste en caso de cambiar tamaño de pantalla
        window.addEventListener('resize', () => {
            if(heartContainer.style.display === 'block') {
                heartContainer.innerHTML = '';
                generateMinimalHeart();
            }
        });
    </script>
</body>
</html>

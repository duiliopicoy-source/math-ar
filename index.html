<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Álgebra · MindAR</title>

  <!--
    STACK:
      A-Frame  1.2.0  (base 3D/WebGL)
      MindAR   1.2.5  (image tracking por software, muy estable en Android)

    ORDEN OBLIGATORIO: A-Frame primero, MindAR después.
  -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ── Reset limpio. Sin filtros ni capas sobre el video. ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:#000;
      font-family:'Courier New', Courier, monospace;
      overflow:hidden;
      color:#00ff88;
    }

    /* A-Frame necesita el canvas libre */
    a-scene {
      position:fixed !important;
      inset:0;
      width:100% !important;
      height:100% !important;
      z-index:0;
    }
    .a-enter-vr, .a-loader-title { display:none !important; }

    /* ════════════════════════════════
       SPLASH / DIAGNÓSTICO DE CÁMARA
    ════════════════════════════════ */
    #splash {
      position:fixed; inset:0; z-index:900;
      background:#000d00;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      gap:18px; padding:28px; text-align:center;
    }

    #splash-icon {
      font-size:48px;
      animation: spin 1.4s linear infinite;
      display:inline-block;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #splash-title {
      font-size:11px; letter-spacing:4px; color:#00cc55;
    }

    #splash-status {
      font-size:14px; letter-spacing:1px; line-height:1.6;
      max-width:340px;
    }

    /* Caja de error — se llena con el mensaje exacto del sistema */
    #error-box {
      display:none;
      background:#0a0000;
      border:1px solid #ff3355;
      color:#ff3355;
      font-size:12px;
      letter-spacing:1px;
      line-height:1.7;
      padding:14px 16px;
      border-radius:3px;
      max-width:360px;
      width:100%;
      text-align:left;
      word-break:break-all;
    }

    #retry-btn {
      display:none;
      background:transparent;
      border:1px solid #00ff88;
      color:#00ff88;
      font-family:'Courier New', Courier, monospace;
      font-size:13px; letter-spacing:3px;
      padding:11px 26px;
      cursor:pointer;
      touch-action:manipulation;
    }

    /* ════════════════════════════════
       HUD
    ════════════════════════════════ */
    #hud {
      position:fixed; top:0; left:0; right:0;
      height:44px;
      background:rgba(0,10,0,0.82);
      border-bottom:1px solid #00cc55;
      display:flex; align-items:center;
      justify-content:space-between;
      padding:0 14px;
      z-index:100;
      /* Sin backdrop-filter: causa bug de compositing en Xiaomi HyperOS */
    }
    #hud span { font-size:13px; letter-spacing:2px; color:#00ff88; }

    /* ════════════════════════════════
       HINT
    ════════════════════════════════ */
    #hint {
      position:fixed; bottom:0; left:0; right:0;
      padding:15px;
      background:rgba(0,10,0,0.82);
      border-top:1px solid #00cc55;
      color:#00cc55; font-size:13px;
      letter-spacing:1px; text-align:center;
      z-index:100;
    }

    /* ════════════════════════════════
       PANEL EJERCICIO
    ════════════════════════════════ */
    #panel {
      display:none;
      position:fixed; bottom:0; left:0; right:0;
      background:rgba(0,10,0,0.90);
      border-top:1px solid #00ff88;
      padding:12px 14px 22px;
      z-index:100;
    }

    #question {
      font-size:15px; color:#00ff88;
      margin-bottom:11px; line-height:1.45;
    }

    #feedback {
      font-size:13px; min-height:20px;
      margin-bottom:10px; letter-spacing:1px;
    }
    #feedback.ok  { color:#00ffcc; }
    #feedback.err { color:#ff3355; }

    /* Botones HTML nativos — sin z-index alto, sin event-delegation */
    #options {
      display:grid; grid-template-columns:1fr 1fr; gap:8px;
    }
    #options button {
      background:rgba(0,255,136,0.07);
      border:1px solid #00aa44;
      color:#00ff88;
      font-family:'Courier New', Courier, monospace;
      font-size:15px; padding:13px 6px;
      border-radius:3px; cursor:pointer;
      letter-spacing:1px;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    #options button.ok  { border-color:#00ffcc; color:#00ffcc; background:rgba(0,255,200,.15); }
    #options button.err { border-color:#ff3355; color:#ff3355; background:rgba(255,50,80,.12); }

    /* ════════════════════════════════
       FIN
    ════════════════════════════════ */
    #endscreen {
      display:none; position:fixed; inset:0;
      background:rgba(0,8,0,0.96);
      flex-direction:column; justify-content:center;
      align-items:center; gap:16px;
      text-align:center; z-index:200; padding:30px;
    }
    #endscreen.show { display:flex; }
    #endscreen h2 { font-size:26px; letter-spacing:4px; }
    #endscreen p  { font-size:14px; color:#00aa44; letter-spacing:2px; }
    #endscreen button {
      margin-top:14px; background:transparent;
      border:1px solid #00ff88; color:#00ff88;
      font-family:'Courier New', Courier, monospace;
      font-size:14px; padding:12px 28px;
      letter-spacing:3px; cursor:pointer;
      touch-action:manipulation;
    }

    /* ════════════════════════════════
       INFO IMAGEN DE SEGUIMIENTO
    ════════════════════════════════ */
    #img-info {
      position:fixed; top:48px; left:0; right:0;
      padding:8px 14px;
      background:rgba(0,10,0,0.70);
      border-bottom:1px solid #004422;
      font-size:11px; color:#00884a;
      letter-spacing:1px; text-align:center;
      z-index:100;
    }
  </style>
</head>
<body>

  <!-- ════ SPLASH DE ARRANQUE ════ -->
  <div id="splash">
    <div id="splash-icon">⬡</div>
    <div id="splash-title">INICIALIZANDO AR ALGEBRA</div>
    <div id="splash-status">Solicitando acceso a cámara...</div>
    <div id="error-box"></div>
    <button id="retry-btn" onclick="location.reload()">[ REINTENTAR ]</button>
  </div>

  <!-- ════ HUD ════ -->
  <div id="hud" style="display:none">
    <span>▶ AR_ALGEBRA</span>
    <span id="prog">EJ 1/10</span>
    <span id="score">✦ 0</span>
  </div>

  <!-- ════ INFO IMAGEN ════ -->
  <div id="img-info" style="display:none">
    Apunta al póster de ejemplo · <a href="https://hiukim.github.io/mind-ar-js-doc/assets/quick-start/card.png"
      style="color:#00ffaa" target="_blank">Ver imagen objetivo ↗</a>
  </div>

  <!-- ════ HINT ════ -->
  <div id="hint" style="display:none">[ APUNTA A LA IMAGEN OBJETIVO ]</div>

  <!-- ════ PANEL ════ -->
  <div id="panel">
    <div id="question">Cargando...</div>
    <div id="feedback"></div>
    <div id="options"></div>
  </div>

  <!-- ════ FIN ════ -->
  <div id="endscreen">
    <h2>MISIÓN COMPLETA</h2>
    <p id="finalscore">ACIERTOS: 0 / 10</p>
    <button onclick="restart()">[ REINICIAR ]</button>
  </div>

  <!--
    A-FRAME + MINDAR SCENE
    ──────────────────────────────────────────────────────────
    mindar-image:
      • imageTargetSrc: archivo .mind (imagen de referencia compilada)
        Usamos el ejemplo oficial de MindAR. Para tu propia imagen:
        1. Ve a https://hiukim.github.io/mind-ar-js-doc/tools/compile
        2. Sube tu imagen → descarga el .mind
        3. Súbelo a tu repo y cambia la URL aquí.
      • autoStart:false → nosotros arrancamos el tracking manualmente
        DESPUÉS de tener el permiso de cámara confirmado.
      • uiLoading / uiError / uiScanning: false → manejamos la UI nosotros.

    renderer:
      • logarithmicDepthBuffer:false → evita pantalla negra en Adreno/Mali
      • precision:medium             → alivia GPU del Redmi
      • alpha:true                   → fondo transparente
  -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc:https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/assets/card-example/targets.mind;
                  autoStart:false;
                  uiLoading:false;
                  uiError:false;
                  uiScanning:false;"
    embedded
    renderer="antialias:true; alpha:true; precision:medium; logarithmicDepthBuffer:false;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
  >
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!--
      a-entity con mindar-image-target index="0"
      El contenido hijo aparece cuando la imagen es detectada.
    -->
    <a-entity mindar-image-target="targetIndex:0">

      <!-- Panel 3D sobre la imagen -->
      <a-plane
        position="0 0 0.001"
        width="1" height="0.55"
        color="#001200"
        opacity="0.88"
        material="shader:flat;"
      ></a-plane>

      <!-- Texto del ejercicio en AR -->
      <a-text
        id="ar-q"
        value="AR ALGEBRA"
        align="center"
        color="#00ff88"
        width="0.9"
        position="0 0.1 0.002"
        wrap-count="24"
      ></a-text>

      <!-- Estado en AR -->
      <a-text
        id="ar-s"
        value="Responde abajo"
        align="center"
        color="#00aa44"
        width="0.8"
        position="0 -0.1 0.002"
        wrap-count="28"
      ></a-text>

    </a-entity>
  </a-scene>

  <script>
    /* ════════════════════════════════════════════
       DIAGNÓSTICO DE CÁMARA
       Antes de arrancar MindAR, pedimos permiso
       explícitamente y capturamos el error exacto.
    ════════════════════════════════════════════ */

    var $splash  = document.getElementById('splash');
    var $status  = document.getElementById('splash-status');
    var $errBox  = document.getElementById('error-box');
    var $retryBtn= document.getElementById('retry-btn');
    var $icon    = document.getElementById('splash-icon');

    function setStatus(msg) { $status.textContent = msg; }

    function showError(err) {
      // Detener animación
      $icon.style.animation = 'none';
      $icon.textContent = '✗';
      $icon.style.color = '#ff3355';

      // Mensaje amigable + código exacto del sistema
      var friendly = '';
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        friendly = 'Permiso de cámara denegado.\nVe a Ajustes del navegador → Permisos → Cámara\ny permite este sitio. Luego recarga.';
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        friendly = 'No se encontró cámara trasera.';
      } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        friendly = 'La cámara está ocupada por otra app.\nCiérrala y recarga.';
      } else if (err.name === 'OverconstrainedError') {
        friendly = 'La configuración de cámara no es compatible con este dispositivo.';
      } else if (err.name === 'SecurityError') {
        friendly = 'Error de seguridad: el sitio debe abrirse por HTTPS.';
      } else if (err.name === 'AbortError') {
        friendly = 'El acceso a la cámara fue interrumpido.';
      } else {
        friendly = 'Error desconocido al acceder a la cámara.';
      }

      setStatus(friendly);

      // Bloque de diagnóstico con el mensaje exacto del sistema
      $errBox.style.display = 'block';
      $errBox.innerHTML =
        '<strong>[ DIAGNÓSTICO ]</strong><br>' +
        'name: '    + (err.name    || 'N/A') + '<br>' +
        'message: ' + (err.message || 'N/A') + '<br>' +
        'constraint: ' + (err.constraint || 'N/A') + '<br>' +
        'stack: '   + (err.stack ? err.stack.split('\n')[0] : 'N/A');

      $retryBtn.style.display = 'block';
    }

    /* ════════════════════════════════════════════
       BOOT: pedir cámara → arrancar MindAR
    ════════════════════════════════════════════ */
    async function boot() {
      setStatus('Verificando disponibilidad de cámara...');

      // 1. Comprobar soporte de API
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError({
          name: 'APINotSupported',
          message: 'navigator.mediaDevices no disponible. Usa Chrome/Firefox por HTTPS.'
        });
        return;
      }

      // 2. Pedir permiso — constraints mínimas para máxima compatibilidad HyperOS
      //    Solo indicamos cámara trasera; NO forzamos resolución.
      var stream;
      try {
        setStatus('Solicitando acceso a cámara trasera...');
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        showError(err);
        return;
      }

      // 3. Permiso concedido → liberar stream (MindAR abrirá su propio track)
      setStatus('✓ Cámara accesible. Cargando motor de tracking...');
      stream.getTracks().forEach(function(t) { t.stop(); });

      // 4. Esperar a que A-Frame y MindAR estén registrados
      var scene = document.getElementById('ar-scene');

      function startMindAR() {
        setStatus('✓ Motor listo. Iniciando tracking...');

        var sys = scene.systems['mindar-image-system'];
        if (!sys) {
          // Aún no registrado, reintentar
          setTimeout(startMindAR, 300);
          return;
        }

        // Arrancar MindAR manualmente (autoStart:false)
        sys.start().then(function() {
          // ✓ Todo OK: ocultar splash, mostrar UI
          $splash.style.display = 'none';
          document.getElementById('hud').style.display      = '';
          document.getElementById('img-info').style.display = '';
          document.getElementById('hint').style.display     = '';

          bindTargetEvents();

        }).catch(function(err) {
          // MindAR falló al abrir la cámara: mostrar diagnóstico
          showError(err instanceof Error ? err : { name:'MindARError', message: String(err) });
        });
      }

      if (scene.hasLoaded) {
        startMindAR();
      } else {
        scene.addEventListener('loaded', startMindAR);
      }
    }

    /* ════════════════════════════════════════════
       EVENTOS DE IMAGEN DETECTADA / PERDIDA
    ════════════════════════════════════════════ */
    function bindTargetEvents() {
      var target = document.querySelector('[mindar-image-target]');
      if (!target) { setTimeout(bindTargetEvents, 400); return; }

      target.addEventListener('targetFound', function() {
        document.getElementById('hint').style.display  = 'none';
        if (idx < EX.length) document.getElementById('panel').style.display = '';
      });

      target.addEventListener('targetLost', function() {
        document.getElementById('panel').style.display = 'none';
        if (idx < EX.length) document.getElementById('hint').style.display  = '';
      });
    }

    /* ════════════════════════════════════════════
       EJERCICIOS
    ════════════════════════════════════════════ */
    var EX = [
      { q:'Si 3x = 21, ¿cuánto vale x?',            opts:['5','7','9','6'],                              ans:'7'          },
      { q:'Resuelve: 2x + 4 = 14',                   opts:['3','5','4','6'],                              ans:'5'          },
      { q:'¿Qué valor de x satisface x² = 49?',      opts:['6','8','7','5'],                              ans:'7'          },
      { q:'Si x/4 = 3, entonces x = ?',              opts:['9','16','12','7'],                            ans:'12'         },
      { q:'Factoriza: x² - 9',                       opts:['(x-3)(x+3)','(x-3)²','(x+9)(x-1)','(x+3)²'],ans:'(x-3)(x+3)' },
      { q:'Si 5x - 3 = 22, ¿cuánto vale x?',        opts:['4','5','6','3'],                              ans:'5'          },
      { q:'Pendiente de y = 3x + 7',                 opts:['7','3','-3','1'],                             ans:'3'          },
      { q:'Resuelve: 4(x - 2) = 16',                opts:['4','6','5','8'],                              ans:'6'          },
      { q:'Si x² + 2x = 0, una solución es x = ?',  opts:['1','-1','-2','2'],                            ans:'-2'         },
      { q:'¿Cuánto vale x en: 2x/3 = 8?',           opts:['10','12','14','16'],                          ans:'12'         }
    ];

    var idx = 0, score = 0, answered = false;

    function load(i) {
      answered = false;
      var ex = EX[i];
      document.getElementById('prog').textContent     = 'EJ '+(i+1)+'/10';
      document.getElementById('question').textContent = ex.q;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className   = '';

      var arQ = document.getElementById('ar-q');
      var arS = document.getElementById('ar-s');
      if (arQ) arQ.setAttribute('value', ex.q);
      if (arS) arS.setAttribute('value', 'Responde abajo');

      var html = '';
      ex.opts.forEach(function(o) {
        var safe = o.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html += '<button onclick="pick(this,\''+safe+'\')">' + o + '</button>';
      });
      document.getElementById('options').innerHTML = html;
    }

    function pick(btn, selected) {
      if (answered) return;
      answered = true;
      var ex = EX[idx];
      var allBtns = document.getElementById('options').querySelectorAll('button');
      allBtns.forEach(function(b){ b.disabled = true; });

      var arS = document.getElementById('ar-s');

      if (selected === ex.ans) {
        score++;
        btn.classList.add('ok');
        document.getElementById('feedback').textContent = '✦ CORRECTO';
        document.getElementById('feedback').className   = 'ok';
        document.getElementById('score').textContent    = '✦ '+score;
        if (arS) arS.setAttribute('value','✦ CORRECTO!');
        setTimeout(next, 1400);
      } else {
        btn.classList.add('err');
        document.getElementById('feedback').textContent = '✗ ERA: '+ex.ans;
        document.getElementById('feedback').className   = 'err';
        if (arS) arS.setAttribute('value','Era: '+ex.ans);
        allBtns.forEach(function(b){
          if (b.textContent.trim() === ex.ans) b.classList.add('ok');
        });
        setTimeout(next, 2000);
      }
    }

    function next() {
      idx++;
      if (idx >= EX.length) {
        document.getElementById('panel').style.display = 'none';
        document.getElementById('hint').style.display  = 'none';
        document.getElementById('endscreen').classList.add('show');
        document.getElementById('finalscore').textContent = 'ACIERTOS: '+score+' / 10';
      } else {
        load(idx);
      }
    }

    function restart() {
      idx = 0; score = 0;
      document.getElementById('score').textContent = '✦ 0';
      document.getElementById('endscreen').classList.remove('show');
      document.getElementById('hint').style.display = '';
      load(0);
    }

    /* ════ ARRANCAR ════ */
    load(0);
    boot();
  </script>
</body>
</html>

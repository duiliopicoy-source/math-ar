<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            font-family: 'Courier New', Courier, monospace;
            color: #1f2833;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Pantalla de Terminal / Consola inicial */
        #terminal-screen {
            background-color: #0d0d11;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            max-width: 450px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .system-text {
            color: #66fcf1;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .status-text {
            color: #c5a3ff;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Botón estilo Cyberpunk */
        #decrypt-btn {
            background: transparent;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 4px;
            display: block;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #decrypt-btn:hover {
            background-color: #ff4d6d;
            color: #000;
            box-shadow: 0 0 15px #ff4d6d;
            transform: scale(1.02);
        }

        /* Contenedor del Corazón */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
        }

        /* Estilo para los nombres con flotación simétrica */
        .heart-text {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            /* Animación uniforme y elegante */
            animation: appear 1.2s ease-out forwards,
                       gentlePulse 4s ease-in-out infinite alternate;
            text-shadow: 0 0 6px rgba(255, 77, 109, 0.4);
        }

        /* Entrada limpia */
        @keyframes appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Pulso sutil en lugar de un movimiento caótico hacia lados aleatorios */
        @keyframes gentlePulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(0.9);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.05) translate(var(--drift-x), var(--drift-y));
                filter: brightness(1.2);
            }
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div class="system-text">[System] Initializing heart_PROTOCOL_v2.0...</div>
        <div class="status-text">&gt; One encrypted package found for you. <span class="blink">_</span></div>
        <button id="decrypt-btn">🔓 Decrypt Message</button>
    </div>

    <div id="heart-container"></div>

    <script>
        const decryptBtn = document.getElementById('decrypt-btn');
        const terminalScreen = document.getElementById('terminal-screen');
        const heartContainer = document.getElementById('heart-container');

        const NAME_TEXT = "Ariana";

        decryptBtn.addEventListener('click', () => {
            terminalScreen.style.opacity = '0';
            terminalScreen.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                terminalScreen.style.display = 'none';
                heartContainer.style.display = 'block';
                generateOrderedHeart();
            }, 800);
        });

        function getHeartCoords(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x, y };
        }

        function createOrderedText(posX, posY, stepRatio, delay) {
            const wordElement = document.createElement('span');
            wordElement.className = 'heart-text';
            wordElement.innerText = NAME_TEXT;

            wordElement.style.left = `${posX}px`;
            wordElement.style.top = `${posY}px`;

            // El delay es secuencial: el corazón se dibuja ordenadamente de afuera hacia adentro
            wordElement.style.animationDelay = `${delay}s, ${delay}s`;

            // Movimiento controlado: una pequeña oscilación elegante de balanceo
            const driftX = ((Math.random() - 0.5) * 8).toFixed(1);
            const driftY = ((Math.random() - 0.5) * 8).toFixed(1);
            wordElement.style.setProperty('--drift-x', `${driftX}px`);
            wordElement.style.setProperty('--drift-y', `${driftY}px`);

            // Escala simétrica: letras un poquito más compactas hacia el centro matemático
            const fontSize = Math.floor(11 + (stepRatio * 4));
            wordElement.style.fontSize = `${fontSize}px`;

            // Colores limpios en paletas suaves
            const colors = ['#ff4d6d', '#ff758f', '#ff0a54', '#ff477e'];
            wordElement.style.color = colors[Math.floor(Math.random() * colors.length)];

            heartContainer.appendChild(wordElement);
        }

        function generateOrderedHeart() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2 - 20;
            const baseScale = Math.min(width, height) * 0.022;

            // Definimos capas concéntricas (Anillos desde el exterior 1.0 hasta el núcleo interior)
            // Esto quita por completo el desorden aleatorio anterior
            const layers = [
                { r: 1.0,  count: 85 }, // Capa exterior (Silueta principal)
                { r: 0.8,  count: 60 }, // Capa intermedia externa
                { r: 0.6,  count: 40 }, // Capa intermedia interna
                { r: 0.4,  count: 25 }, // Capa cercana al centro
                { r: 0.18, count: 10 }  // Centro profundo
            ];

            let globalDelay = 0;

            layers.forEach((layer) => {
                for (let i = 0; i < layer.count; i++) {
                    // Dividimos los ángulos exactamente de forma equitativa en cada capa
                    const t = Math.PI * 2 * (i / layer.count);
                    const coords = getHeartCoords(t);

                    const posX = centerX + coords.x * baseScale * layer.r;
                    const posY = centerY - coords.y * baseScale * layer.r;

                    createOrderedText(posX, posY, layer.r, globalDelay);
                    
                    // Incremento milimétrico del retraso para crear un efecto de trazo fluido
                    globalDelay += 0.006; 
                }
                // Pausa sutil entre cada capa para que visualmente se note el orden estructurado
                globalDelay += 0.15; 
            });
        }

        window.addEventListener('resize', () => {
            if(heartContainer.style.display === 'block') {
                heartContainer.innerHTML = '';
                generateOrderedHeart();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            font-family: 'Courier New', Courier, monospace;
            color: #1f2833;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Pantalla de Terminal / Consola inicial */
        #terminal-screen {
            background-color: #0d0d11;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            max-width: 450px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .system-text {
            color: #66fcf1;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .status-text {
            color: #c5a3ff;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Botón estilo Cyberpunk */
        #decrypt-btn {
            background: transparent;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 4px;
            display: block;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #decrypt-btn:hover {
            background-color: #ff4d6d;
            color: #000;
            box-shadow: 0 0 15px #ff4d6d;
            transform: scale(1.02);
        }

        /* Contenedor del Corazón */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
        }

        /* Cada "Love you" individual */
        .heart-text {
            position: absolute;
            color: #ff4d6d;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            /* Primera animación: aparecer. Segunda animación: movimiento infinito */
            animation: appear 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       floatMovement 4s ease-in-out infinite alternate;
            text-shadow: 0 0 8px rgba(255, 77, 109, 0.4);
        }

        /* Animación de entrada */
        @keyframes appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }
            100% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Animación de movimiento constante (Efecto flotante y latido) */
        @keyframes floatMovement {
            0% {
                margin-top: 0px;
                margin-left: 0px;
                filter: brightness(1);
            }
            50% {
                margin-top: var(--move-y, 8px);
                margin-left: var(--move-x, -5px);
                filter: brightness(1.2); /* Sutil parpadeo de luz */
            }
            100% {
                margin-top: var(--move-y-end, -6px);
                margin-left: var(--move-x-end, 6px);
                filter: brightness(0.9);
            }
        }

        /* Texto flotante central principal */
        #main-title {
            position: absolute;
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            z-index: 5;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            opacity: 0;
            display: none;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div class="system-text">[System] Initializing heart_PROTOCOL_v2.0...</div>
        <div class="status-text">&gt; One encrypted package found for you. <span class="blink">_</span></div>
        <button id="decrypt-btn">🔓 Decrypt Message</button>
    </div>

    <h1 id="main-title">Love you.</h1>
    <div id="heart-container"></div>

    <script>
        const decryptBtn = document.getElementById('decrypt-btn');
        const terminalScreen = document.getElementById('terminal-screen');
        const heartContainer = document.getElementById('heart-container');
        const mainTitle = document.getElementById('main-title');

        // Subimos la cantidad a 550 para rellenar perfectamente el fondo y el centro
        const TOTAL_TEXTS = 550; 
        const TEXT_PHRASE = "I love you";

        decryptBtn.addEventListener('click', () => {
            terminalScreen.style.opacity = '0';
            terminalScreen.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                terminalScreen.style.display = 'none';
                heartContainer.style.display = 'block';
                mainTitle.style.display = 'block';
                // Pequeño timeout para activar la transición de opacidad suave
                setTimeout(() => mainTitle.style.opacity = '1', 50);
                
                generateDenseHeart();
            }, 800);
        });

        function generateDenseHeart() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2 - 20;

            // Factor de escala base
            const baseScale = Math.min(width, height) * 0.022; 

            for (let i = 0; i < TOTAL_TEXTS; i++) {
                const t = Math.PI * 2 * (i / TOTAL_TEXTS); 
                
                // Coordenadas de la silueta exterior original
                const xMod = 16 * Math.pow(Math.sin(t), 3);
                const yMod = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                // TRUCO DE RELLENO: 
                // Multiplicamos la escala por un factor aleatorio 'r' entre 0.0 y 1.0.
                // Esto hace que los textos no se queden solo en el borde, sino que se esparzan hacia el centro.
                // Usamos Math.sqrt(Math.random()) para que haya una transición fluida y no se amontone todo en el centro exacto.
                const r = Math.sqrt(Math.random()); 
                const currentScale = baseScale * r;

                // Calculamos la posición final con su respectiva escala de reducción interna
                const posX = centerX + xMod * currentScale;
                const posY = centerY - yMod * currentScale;

                // Crear elemento
                const wordElement = document.createElement('span');
                wordElement.className = 'heart-text';
                wordElement.innerText = TEXT_PHRASE;

                // Añadir un desfase orgánico leve para romper la rigidez matemática pura
                const jitter = 12; 
                const finalX = posX + (Math.random() - 0.5) * jitter;
                const finalY = posY + (Math.random() - 0.5) * jitter;

                wordElement.style.left = `${finalX}px`;
                wordElement.style.top = `${finalY}px`;

                // Tiempos de aparición aleatorios para el efecto de cascada del video
                const randomDelay = Math.random() * 2.2; 
                wordElement.style.animationDelay = `${randomDelay}s, ${randomDelay}s`;

                // VARIABLES DINÁMICAS CSS: Le damos a cada texto direcciones de movimiento únicas
                // Así cada palabra flota de forma independiente hacia un lado diferente
                const moveX = ((Math.random() - 0.5) * 20).toFixed(1);
                const moveY = ((Math.random() - 0.5) * 20).toFixed(1);
                const moveXEnd = ((Math.random() - 0.5) * 20).toFixed(1);
                const moveYEnd = ((Math.random() - 0.5) * 20).toFixed(1);

                wordElement.style.setProperty('--move-x', `${moveX}px`);
                wordElement.style.setProperty('--move-y', `${moveY}px`);
                wordElement.style.setProperty('--move-x-end', `${moveXEnd}px`);
                wordElement.style.setProperty('--move-y-end', `${moveYEnd}px`);

                // Tamaño de letra: Textos más pequeños en el fondo/centro y grandes en los bordes (Efecto 3D)
                // Si 'r' es cercano a 0 (centro), la letra es más chica. Si 'r' es cercano a 1 (borde), es más grande.
                const fontSize = Math.floor(10 + (r * 6) + (Math.random() * 3));
                wordElement.style.fontSize = `${fontSize}px`;

                // Colores degradados aleatorios dentro de la gama de rojos/rosas neón
                const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#ff0a54', '#ffccd5'];
                wordElement.style.color = colors[Math.floor(Math.random() * colors.length)];

                heartContainer.appendChild(wordElement);
            }
        }

        // Recalcular si cambian el tamaño de la ventana (pantalla dividida o rotación de celular)
        window.addEventListener('resize', () => {
            if(heartContainer.style.display === 'block') {
                heartContainer.innerHTML = '';
                generateDenseHeart();
            }
        });
    </script>
</body>
</html>

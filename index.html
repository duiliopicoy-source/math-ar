<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#000"/>
<title>Ecuaciones AR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--g:#39ff14;--c:#00e5ff;--o:#ff8c00;--r:#ff2244;--gold:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;font-family:'JetBrains Mono',monospace;}

/* ── CÁMARA (fondo real) ── */
#video{
  position:fixed;inset:0;z-index:0;
  width:100%;height:100%;
  object-fit:cover;
  /* sin espejo para cámara trasera */
}

/* ── CANVAS encima de la cámara ── */
#ar{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
}

/* ── SCANLINES ── */
#scan{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    transparent,transparent 3px,
    rgba(57,255,20,0.012) 3px,rgba(57,255,20,0.012) 4px);
}

/* ── VISOR CORNERS ── */
.vc{position:fixed;width:28px;height:28px;z-index:3;pointer-events:none;}
.tl{top:10px;left:10px;border-top:2px solid var(--g);border-left:2px solid var(--g);}
.tr{top:10px;right:10px;border-top:2px solid var(--g);border-right:2px solid var(--g);}
#bl{position:fixed;left:10px;width:28px;height:28px;z-index:3;pointer-events:none;border-bottom:2px solid var(--g);border-left:2px solid var(--g);}
#br{position:fixed;right:10px;width:28px;height:28px;z-index:3;pointer-events:none;border-bottom:2px solid var(--g);border-right:2px solid var(--g);}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:5;
  height:46px;
  background:linear-gradient(180deg,rgba(0,0,0,0.82) 0%,transparent 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
}
#topbar h1{
  font-family:'Orbitron',monospace;font-size:0.68rem;
  font-weight:900;letter-spacing:3px;color:var(--g);
  text-shadow:0 0 14px #39ff14aa;
}
.live{font-size:0.58rem;letter-spacing:2px;color:rgba(57,255,20,0.45);}
.live b{animation:blink 1.2s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ════════════════════════════════
   PANTALLA DE PERMISO (inicio)
════════════════════════════════ */
#perm{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at center,#031000 0%,#000 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;padding:40px 30px;text-align:center;
}
#perm .logo{
  font-family:'Orbitron',monospace;
  font-size:2rem;font-weight:900;
  color:var(--g);
  text-shadow:0 0 30px var(--g),0 0 60px rgba(57,255,20,0.2);
  line-height:1.2;
}
#perm p{
  font-size:0.75rem;color:rgba(57,255,20,0.5);
  line-height:1.85;max-width:280px;
}
#perm p span{color:var(--g);}
#btnperm{
  padding:16px 42px;
  background:rgba(57,255,20,0.08);
  border:2px solid var(--g);
  color:var(--g);font-family:'Orbitron',monospace;
  font-size:0.85rem;font-weight:900;letter-spacing:3px;
  border-radius:12px;cursor:pointer;
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 14px #39ff1444;}50%{box-shadow:0 0 32px #39ff14cc;}}
#errormsg{
  color:var(--r);font-size:0.72rem;
  line-height:1.7;display:none;
  background:rgba(255,34,68,0.08);
  border:1px solid rgba(255,34,68,0.3);
  border-radius:8px;padding:10px 14px;
  max-width:280px;
}

/* ════════════════════════════════
   PANEL INFERIOR
════════════════════════════════ */
#panel{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:rgba(0,0,0,0.95);
  border-top:1px solid rgba(57,255,20,0.18);
  border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;
}
#handle{
  width:38px;height:4px;
  background:rgba(57,255,20,0.22);
  border-radius:2px;margin:10px auto 4px;flex-shrink:0;
}

/* tabs */
#tabs{
  display:flex;padding:0 14px;
  border-bottom:1px solid rgba(57,255,20,0.12);
  flex-shrink:0;
}
.tab{
  flex:1;padding:10px 4px;text-align:center;
  font-size:0.63rem;letter-spacing:1px;text-transform:uppercase;
  color:rgba(57,255,20,0.35);cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.2s;
}
.tab.on{color:var(--g);border-bottom-color:var(--g);}

/* scroll interior */
.tcontent{display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 22px;max-height:45vh;}
.tcontent.on{display:block;}
.tcontent::-webkit-scrollbar{display:none;}

/* ecuación grande */
#eqlabel{
  font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;
  color:#fff;text-shadow:0 0 16px var(--g);
  text-align:center;padding:6px 0 12px;letter-spacing:1px;
}

/* coeficientes */
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:13px;}
.cbox{
  background:rgba(57,255,20,0.04);border:1px solid rgba(57,255,20,0.18);
  border-radius:11px;padding:9px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.cbox label{font-size:0.58rem;letter-spacing:1px;color:rgba(57,255,20,0.4);text-transform:uppercase;}
.cbox input{
  width:100%;background:transparent;
  border:none;border-bottom:2px solid rgba(57,255,20,0.28);
  color:var(--g);font-family:'JetBrains Mono',monospace;
  font-size:1.2rem;font-weight:700;
  text-align:center;outline:none;padding:2px 0;
}
.cbox input:focus{border-bottom-color:var(--g);}

/* botones */
.brow{display:flex;gap:9px;}
.btn{
  flex:1;padding:13px 6px;border-radius:9px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border:1px solid;transition:all 0.15s;
}
.bs{background:rgba(57,255,20,0.1);border-color:rgba(57,255,20,0.45);color:var(--g);}
.bs:active{background:rgba(57,255,20,0.25);transform:scale(.97);}
.br2{background:rgba(0,229,255,0.07);border-color:rgba(0,229,255,0.35);color:var(--c);}
.br2:active{background:rgba(0,229,255,0.2);transform:scale(.97);}

/* resolución */
.rtitle{
  font-family:'Orbitron',monospace;font-size:0.6rem;
  letter-spacing:2px;color:rgba(57,255,20,0.3);
  text-transform:uppercase;
  padding:2px 0 10px;border-top:1px solid rgba(57,255,20,0.1);
}
.paso{
  background:rgba(5,14,3,0.9);
  border-left:3px solid var(--g);
  border-radius:0 9px 9px 0;
  padding:10px 12px;margin-bottom:9px;
  opacity:0;animation:fi 0.32s ease both;
}
.paso:nth-child(1){animation-delay:.04s}
.paso:nth-child(2){animation-delay:.10s}
.paso:nth-child(3){animation-delay:.17s}
.paso:nth-child(4){animation-delay:.24s}
.paso:nth-child(5){animation-delay:.31s}
.paso:nth-child(6){animation-delay:.38s}
@keyframes fi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.ptit{font-size:0.57rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(57,255,20,0.3);margin-bottom:5px;}
.pbody{font-size:0.8rem;line-height:1.82;color:#bbb;}
.pbody .w {color:#fff;font-weight:700;}
.pbody .g {color:var(--g);font-weight:700;}
.pbody .c {color:var(--c);font-weight:700;}
.pbody .o {color:var(--o);font-weight:700;}
.pbody .r {color:var(--r);font-weight:700;}
.pbody .gd{color:var(--gold);font-weight:700;}

.resbox{
  border-radius:13px;padding:16px 12px;
  text-align:center;margin-top:4px;
  opacity:0;animation:fi 0.4s .45s ease both;
}
.resbox.dos {background:rgba(0,229,255,0.07);border:1px solid rgba(0,229,255,0.28);}
.resbox.uno {background:rgba(255,215,0,0.07);border:1px solid rgba(255,215,0,0.28);}
.resbox.no  {background:rgba(255,34,68,0.06); border:1px solid rgba(255,34,68,0.26);}
.reslbl{
  font-family:'Orbitron',monospace;font-size:0.6rem;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;
}
.resbox.dos .reslbl{color:var(--c);}
.resbox.uno .reslbl{color:var(--gold);}
.resbox.no  .reslbl{color:var(--r);}
.roots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.rbox{background:rgba(0,0,0,0.5);border-radius:9px;padding:9px 16px;min-width:90px;}
.rn{font-size:0.58rem;color:rgba(255,255,255,0.28);margin-bottom:3px;}
.rv{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:900;}
.rx1{color:var(--c);text-shadow:0 0 10px var(--c);}
.rx2{color:var(--o);text-shadow:0 0 10px var(--o);}
.rxd{color:var(--gold);text-shadow:0 0 10px var(--gold);}
.rxc{color:var(--r);font-size:0.76rem;}
</style>
</head>
<body>

<!-- VIDEO CÁMARA -->
<video id="video" autoplay playsinline muted></video>
<!-- CANVAS AR -->
<canvas id="ar"></canvas>
<!-- SCANLINES -->
<div id="scan"></div>
<!-- VISOR -->
<div class="vc tl"></div>
<div class="vc tr"></div>
<div id="bl"></div>
<div id="br"></div>
<!-- TOP BAR -->
<div id="topbar">
  <h1>ECUACIONES AR</h1>
  <span class="live"><b>●</b> CÁMARA EN VIVO</span>
</div>

<!-- ════ PANTALLA DE PERMISO ════ -->
<div id="perm">
  <div class="logo">📷<br>AR<br>ecuaciones</div>
  <p>
    La ecuación cuadrática flotará<br>
    <span>sobre lo que ve tu cámara.</span><br>
    Necesitamos permiso para activarla.
  </p>
  <button id="btnperm" onclick="pedirPermiso()">
    ACTIVAR CÁMARA
  </button>
  <div id="errormsg"></div>
</div>

<!-- ════ PANEL INFERIOR ════ -->
<div id="panel">
  <div id="handle"></div>

  <div id="tabs">
    <div class="tab on"  id="t0" onclick="tab(0)">📐 Ingresar</div>
    <div class="tab"     id="t1" onclick="tab(1)">🔢 Resolución</div>
  </div>

  <!-- TAB 0 -->
  <div class="tcontent on" id="tc0">
    <div id="eqlabel">ax² + bx + c = 0</div>
    <div class="cgrid">
      <div class="cbox"><label>a · x²</label><input type="number" id="ia" value="1"  inputmode="decimal"></div>
      <div class="cbox"><label>b · x</label> <input type="number" id="ib" value="-5" inputmode="decimal"></div>
      <div class="cbox"><label>c</label>      <input type="number" id="ic" value="6"  inputmode="decimal"></div>
    </div>
    <div class="brow">
      <button class="btn bs"  onclick="resolver()">▶ RESOLVER</button>
      <button class="btn br2" onclick="aleatorio()">⚡ RANDOM</button>
    </div>
  </div>

  <!-- TAB 1 -->
  <div class="tcontent" id="tc1">
    <div id="pasos-out"></div>
    <div id="result-out"></div>
  </div>
</div>

<script>
// ══════════════════════════════════
//  TABS
// ══════════════════════════════════
function tab(i){
  [0,1].forEach(j=>{
    document.getElementById('t'+j).classList.toggle('on',j===i);
    document.getElementById('tc'+j).classList.toggle('on',j===i);
  });
  ajustarEsquinas();
}

// ══════════════════════════════════
//  PEDIR PERMISO DE CÁMARA
// ══════════════════════════════════
async function pedirPermiso(){
  const btn = document.getElementById('btnperm');
  const err = document.getElementById('errormsg');
  btn.textContent = 'Solicitando...';
  btn.style.opacity = '0.6';
  err.style.display = 'none';

  try {
    // primero intenta cámara trasera
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{exact:'environment'}, width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
    } catch(e){
      // si falla (ej. solo tiene frontal), pedir cualquier cámara
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
    }

    const v = document.getElementById('video');
    v.srcObject = stream;
    await v.play();

    // ocultar pantalla de permiso
    document.getElementById('perm').style.display = 'none';

    // iniciar canvas y loop
    initAR();
    resolver(); // carga ecuación inicial
    loop();

  } catch(e){
    btn.textContent = 'ACTIVAR CÁMARA';
    btn.style.opacity = '1';
    err.style.display = 'block';

    if(e.name === 'NotAllowedError'){
      err.innerHTML = '⚠ Permiso denegado.<br>Ve a Ajustes del navegador y permite la cámara para este sitio, luego recarga.';
    } else if(e.name === 'NotFoundError'){
      err.innerHTML = '⚠ No se encontró ninguna cámara en este dispositivo.';
    } else if(e.name === 'NotReadableError'){
      err.innerHTML = '⚠ La cámara está siendo usada por otra app. Ciérrala e intenta de nuevo.';
    } else {
      err.innerHTML = '⚠ Error: ' + e.message + '<br><small>Asegúrate de usar HTTPS o localhost.</small>';
    }
  }
}

// ══════════════════════════════════
//  CANVAS AR
// ══════════════════════════════════
let canvas, ctx, W, H;
let arLineas = [];
let tiempo = 0;
let animId  = null;

function initAR(){
  canvas = document.getElementById('ar');
  redimensionar();
  ctx = canvas.getContext('2d');
  window.addEventListener('resize', redimensionar);
}

function redimensionar(){
  if(!canvas) return;
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ajustarEsquinas();
}

function ajustarEsquinas(){
  const ph = document.getElementById('panel').offsetHeight || 0;
  document.getElementById('bl').style.bottom = (ph+10)+'px';
  document.getElementById('br').style.bottom = (ph+10)+'px';
}

// Construye las líneas que se dibujan sobre la cámara
// SOLO muestra la ecuación — nada más
function construirAR(a, b, c){
  arLineas = [];
  tiempo   = 0;

  const bS = b===0?'':(b>0?` + ${b}x`:` − ${Math.abs(b)}x`);
  const cS = c===0?'':(c>0?` + ${c}` :` − ${Math.abs(c)}`);
  const eq = `${a}x²${bS}${cS} = 0`;

  // Solo 3 líneas, limpias y separadas
  arLineas = [
    { texto: eq,                      color:'#ffffff', size:30, glow:true,  delay:0    },
    { texto: '─────────────────────', color:'rgba(57,255,20,0.2)', size:10, glow:false, delay:0.2  },
    { texto: `a=${a}   b=${b}   c=${c}`, color:'#aaffaa', size:16, glow:false, delay:0.35 },
  ];
}

// Dibuja las líneas centradas en la zona de cámara (encima del panel)
function dibujarAR(){
  if(!ctx || !arLineas.length) return;

  const panelH = document.getElementById('panel').offsetHeight || 0;
  const topH   = 46; // topbar
  const areaH  = H - panelH - topH;
  const cx     = W / 2;

  const lineH  = areaH / (arLineas.length + 2);
  const totalH = arLineas.length * lineH;
  const startY = topH + (areaH - totalH) / 2 + lineH * 0.6;

  arLineas.forEach((l, i) => {
    if(tiempo < l.delay) return;
    const age   = tiempo - l.delay;
    const alpha = Math.min(1, age * 2.5);
    const floatY= Math.sin(tiempo * 0.55 + i * 0.8) * 3;
    const sy    = startY + i * lineH + floatY;
    const fs    = l.size * (W / 400);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${fs}px Orbitron, monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    if(l.glow){
      // sombra negra para legibilidad sobre cualquier fondo de cámara
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur  = 0;
      ctx.fillStyle   = 'rgba(0,0,0,0.6)';
      // fondo semitransparente detrás del texto
      const metrics = ctx.measureText(l.texto);
      const pw = metrics.width + 28;
      const ph2 = fs * 1.3;
      ctx.beginPath();
      ctx.roundRect(cx - pw/2, sy - ph2/2, pw, ph2, 8);
      ctx.fill();

      ctx.shadowColor = l.color;
      ctx.shadowBlur  = 16;
    }

    ctx.fillStyle = l.color;
    ctx.fillText(l.texto, cx, sy);
    ctx.restore();
  });
}

function loop(){
  animId = requestAnimationFrame(loop);
  tiempo += 0.016;
  if(!ctx) return;
  ctx.clearRect(0, 0, W, H);
  dibujarAR();
}

// ══════════════════════════════════
//  RESOLVER
// ══════════════════════════════════
function resolver(){
  const a = parseFloat(document.getElementById('ia').value) || 1;
  const b = parseFloat(document.getElementById('ib').value) || 0;
  const c = parseFloat(document.getElementById('ic').value) || 0;

  if(a === 0){
    document.getElementById('pasos-out').innerHTML =
      '<div class="paso"><div class="pbody"><span class="r">⚠ "a" no puede ser 0</span></div></div>';
    document.getElementById('result-out').innerHTML = '';
    return;
  }

  // Etiqueta de ecuación en el tab
  const bL = b>=0?`+ ${b}x`:`− ${Math.abs(b)}x`;
  const cL = c>=0?`+ ${c}` :`− ${Math.abs(c)}`;
  document.getElementById('eqlabel').textContent = `${a}x² ${bL} ${cL} = 0`;

  const D   = b*b - 4*a*c;
  const sqD = D >= 0 ? Math.sqrt(D) : null;

  // ─── PASOS ─────────────────────
  const pasos = [];

  pasos.push({
    tit:'PASO 1 — Identificar coeficientes',
    body:`Forma: <span class="w">ax² + bx + c = 0</span><br>
          <span class="g">a = ${a}</span> &nbsp;|&nbsp;
          <span class="c">b = ${b}</span> &nbsp;|&nbsp;
          <span class="o">c = ${c}</span>`
  });

  pasos.push({
    tit:'PASO 2 — Discriminante (Δ = b² − 4ac)',
    body:`Δ = <span class="c">(${b})²</span> − 4·<span class="g">${a}</span>·<span class="o">${c}</span><br>
          Δ = <span class="w">${b*b}</span> − <span class="w">${4*a*c}</span><br>
          Δ = <span class="${D>0?'g':D===0?'gd':'r'}">${D}</span>
          &nbsp;${D>0?'→ 2 raíces reales':D===0?'→ Raíz doble':'→ Sin raíces reales'}`
  });

  pasos.push({
    tit:'PASO 3 — Fórmula cuadrática',
    body:`<span class="w">x = (−b ± √Δ) / 2a</span><br>
          x = (−<span class="c">${b}</span> ± √<span class="${D>0?'g':D===0?'gd':'r'}">${D}</span>) / 2·<span class="g">${a}</span><br>
          x = (<span class="w">${-b}</span> ± <span class="w">${D>=0?sqD.toFixed(4):'i·'+Math.sqrt(-D).toFixed(4)}</span>) / <span class="w">${2*a}</span>`
  });

  let resHTML='', resClass='';

  if(D > 0){
    const x1 = (-b+sqD)/(2*a);
    const x2 = (-b-sqD)/(2*a);
    pasos.push({
      tit:'PASO 4 — Calcular raíces',
      body:`<span class="c">x₁</span> = (${-b}+${sqD.toFixed(4)}) / ${2*a} = <span class="c">${x1.toFixed(6)}</span><br>
            <span class="o">x₂</span> = (${-b}−${sqD.toFixed(4)}) / ${2*a} = <span class="o">${x2.toFixed(6)}</span>`
    });
    pasos.push({
      tit:'VERIFICACIÓN',
      body:`x₁: resultado ≈ <span class="g">${(a*x1*x1+b*x1+c).toFixed(5)} ✔</span><br>
            x₂: resultado ≈ <span class="g">${(a*x2*x2+b*x2+c).toFixed(5)} ✔</span>`
    });
    resClass='dos';
    resHTML=`<div class="reslbl">✔ DOS RAÍCES REALES</div>
      <div class="roots">
        <div class="rbox"><div class="rn">x₁</div><div class="rv rx1">${x1.toFixed(4)}</div></div>
        <div class="rbox"><div class="rn">x₂</div><div class="rv rx2">${x2.toFixed(4)}</div></div>
      </div>`;

  } else if(D === 0){
    const x1 = -b/(2*a);
    pasos.push({
      tit:'PASO 4 — Raíz doble',
      body:`x = ${-b} / ${2*a} = <span class="gd">${x1.toFixed(6)}</span>`
    });
    resClass='uno';
    resHTML=`<div class="reslbl">★ RAÍZ DOBLE</div>
      <div class="roots">
        <div class="rbox"><div class="rn">x₁=x₂</div><div class="rv rxd">${x1.toFixed(4)}</div></div>
      </div>`;

  } else {
    const re = -b/(2*a);
    const im = Math.sqrt(-D)/(2*a);
    pasos.push({
      tit:'PASO 4 — Raíces complejas',
      body:`<span class="c">x₁</span> = ${re.toFixed(4)} + ${im.toFixed(4)}i<br>
            <span class="o">x₂</span> = ${re.toFixed(4)} − ${im.toFixed(4)}i`
    });
    resClass='no';
    resHTML=`<div class="reslbl">✘ SIN RAÍCES REALES (Δ&lt;0)</div>
      <div class="roots">
        <div class="rbox"><div class="rn">x₁</div><div class="rv rxc">${re.toFixed(3)}+${im.toFixed(3)}i</div></div>
        <div class="rbox"><div class="rn">x₂</div><div class="rv rxc">${re.toFixed(3)}−${im.toFixed(3)}i</div></div>
      </div>`;
  }

  // renderizar
  document.getElementById('pasos-out').innerHTML =
    pasos.map(p=>`<div class="paso"><div class="ptit">${p.tit}</div><div class="pbody">${p.body}</div></div>`).join('');
  document.getElementById('result-out').innerHTML =
    `<div class="resbox ${resClass}">${resHTML}</div>`;

  // actualizar AR (solo la ecuación en cámara)
  construirAR(a, b, c);

  // ir a resolución automáticamente
  tab(1);
}

function aleatorio(){
  const sg=[-1,1];
  document.getElementById('ia').value=sg[Math.random()<.5?0:1]*(1+Math.floor(Math.random()*4));
  document.getElementById('ib').value=Math.round(Math.random()*14-7);
  document.getElementById('ic').value=Math.round(Math.random()*12-6);
  resolver();
}

['ia','ib','ic'].forEach(id=>document.getElementById(id).addEventListener('change',resolver));

// ajustar esquinas al cargar
window.addEventListener('load', ajustarEsquinas);
</script>

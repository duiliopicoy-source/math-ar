<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Álgebra</title>

  <!--
    ORDEN CRÍTICO: A-Frame PRIMERO, AR.js DESPUÉS.
    AR.js registra sus componentes sobre A-Frame al cargarse;
    si se invierten, el handshake falla y la cámara no arranca.
  -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.2.0/dist/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.3/aframe/build/aframe-ar.js"></script>

  <style>
    /* ── Reset mínimo. Sin filtros ni capas sobre el video de cámara. ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* A-Frame necesita el canvas libre, sin nada encima que bloquee el video */
    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 0;
    }

    .a-enter-vr,
    .a-loader-title { display: none !important; }

    /* ── HUD superior: liviano, sin backdrop-filter (bug en MIUI/HyperOS) ── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(0, 10, 0, 0.80);
      border-bottom: 1px solid #00cc55;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 100;
    }
    #hud span { color: #00ff88; font-size: 13px; letter-spacing: 2px; }

    /* ── Hint ── */
    #hint {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 16px;
      background: rgba(0, 10, 0, 0.80);
      color: #00cc55;
      font-size: 13px;
      letter-spacing: 1px;
      text-align: center;
      z-index: 100;
      border-top: 1px solid #00cc55;
    }

    /* ── Panel de ejercicio: oculto hasta markerFound ── */
    #panel {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(0, 10, 0, 0.88);
      border-top: 1px solid #00ff88;
      padding: 12px 14px 20px;
      z-index: 100;
    }

    #question {
      color: #00ff88;
      font-size: 15px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    #feedback {
      font-size: 13px;
      min-height: 20px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    #feedback.ok  { color: #00ffcc; }
    #feedback.err { color: #ff3355; }

    /*
      Botonera HTML nativa: grid 2×2.
      Sin z-index alto ni pointer-events manipulados en padres.
      El evento click llega directamente al botón sin interferir con el canvas.
    */
    #options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #options button {
      background: rgba(0, 255, 136, 0.07);
      border: 1px solid #00aa44;
      color: #00ff88;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      padding: 13px 6px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 1px;
      touch-action: manipulation;          /* elimina delay 300ms en móvil */
      -webkit-tap-highlight-color: transparent;
    }

    #options button.ok {
      border-color: #00ffcc;
      color: #00ffcc;
      background: rgba(0, 255, 200, 0.15);
    }
    #options button.err {
      border-color: #ff3355;
      color: #ff3355;
      background: rgba(255, 50, 80, 0.12);
    }

    /* ── Pantalla final ── */
    #endscreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 8, 0, 0.96);
      color: #00ff88;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
      z-index: 200;
      padding: 30px;
    }
    #endscreen.show { display: flex; }
    #endscreen h2 { font-size: 26px; letter-spacing: 4px; }
    #endscreen p  { font-size: 14px; color: #00aa44; letter-spacing: 2px; }

    #endscreen button {
      margin-top: 14px;
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      padding: 12px 28px;
      letter-spacing: 3px;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="hud">
    <span>▶ AR_ALGEBRA</span>
    <span id="prog">EJ 1/10</span>
    <span id="score">✦ 0</span>
  </div>

  <!-- Hint -->
  <div id="hint">[ APUNTA AL MARCADOR HIRO ]</div>

  <!-- Panel ejercicio -->
  <div id="panel">
    <div id="question">Cargando...</div>
    <div id="feedback"></div>
    <div id="options"></div>
  </div>

  <!-- Pantalla final -->
  <div id="endscreen">
    <h2>MISIÓN COMPLETA</h2>
    <p id="finalscore">ACIERTOS: 0 / 10</p>
    <button onclick="restart()">[ REINICIAR ]</button>
  </div>

  <!--
    A-FRAME SCENE
    ─────────────────────────────────────────────────────
    renderer:
      • logarithmicDepthBuffer:false → evita pantalla negra en GPU Adreno/Mali
      • precision:medium             → alivia la GPU del Redmi
      • alpha:true                   → fondo transparente para ver la cámara

    arjs:
      • sourceType:webcam            → usa la cámara del dispositivo
      • videoSettings:{facingMode:'environment'}
          Solo indica la cámara trasera; NO forzamos resolución.
          AR.js negocia con el driver la mejor config disponible.
          En HyperOS, imponer constraints de resolución rompe el handshake.
      • debugUIEnabled:false         → sin overlay rojo (consume GPU)
      • detectionMode:mono_and_matrix + matrixCodeType:3x3
          Configuración más estable para el marcador Hiro impreso.
  -->
  <a-scene
    embedded
    renderer="antialias:true; alpha:true; precision:medium; logarithmicDepthBuffer:false;"
    vr-mode-ui="enabled:false"
    arjs="sourceType:webcam;
          videoSettings:{facingMode:'environment'};
          debugUIEnabled:false;
          detectionMode:mono_and_matrix;
          matrixCodeType:3x3;"
  >
    <a-assets></a-assets>

    <a-marker preset="hiro" id="hiro" emitevents="true">

      <!-- Fondo del panel 3D -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="2.6" height="1.4"
        color="#001200"
        opacity="0.85"
        material="shader:flat;"
      ></a-plane>

      <!-- Texto del ejercicio en AR -->
      <a-text
        id="ar-q"
        value="AR ALGEBRA"
        align="center"
        color="#00ff88"
        width="2.4"
        position="0 0.62 0"
        rotation="-90 0 0"
        wrap-count="26"
      ></a-text>

      <!-- Estado en AR -->
      <a-text
        id="ar-s"
        value="Responde abajo"
        align="center"
        color="#00aa44"
        width="2.0"
        position="0 0.18 0"
        rotation="-90 0 0"
        wrap-count="30"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    /* ── Ejercicios ──────────────────────────────────── */
    const EX = [
      { q:"Si 3x = 21, ¿cuánto vale x?",            opts:["5","7","9","6"],                           ans:"7"         },
      { q:"Resuelve: 2x + 4 = 14",                   opts:["3","5","4","6"],                           ans:"5"         },
      { q:"¿Qué valor de x satisface x² = 49?",      opts:["6","8","7","5"],                           ans:"7"         },
      { q:"Si x/4 = 3, entonces x = ?",              opts:["9","16","12","7"],                         ans:"12"        },
      { q:"Factoriza: x² - 9",                       opts:["(x-3)(x+3)","(x-3)²","(x+9)(x-1)","(x+3)²"], ans:"(x-3)(x+3)" },
      { q:"Si 5x - 3 = 22, ¿cuánto vale x?",        opts:["4","5","6","3"],                           ans:"5"         },
      { q:"Pendiente de y = 3x + 7",                 opts:["7","3","-3","1"],                          ans:"3"         },
      { q:"Resuelve: 4(x - 2) = 16",                opts:["4","6","5","8"],                           ans:"6"         },
      { q:"Si x² + 2x = 0, una solución es x = ?",  opts:["1","-1","-2","2"],                         ans:"-2"        },
      { q:"¿Cuánto vale x en: 2x/3 = 8?",           opts:["10","12","14","16"],                       ans:"12"        }
    ];

    /* ── Estado ──────────────────────────────────────── */
    let idx = 0, score = 0, answered = false;

    const $panel    = document.getElementById('panel');
    const $hint     = document.getElementById('hint');
    const $question = document.getElementById('question');
    const $feedback = document.getElementById('feedback');
    const $options  = document.getElementById('options');
    const $prog     = document.getElementById('prog');
    const $score    = document.getElementById('score');
    const $end      = document.getElementById('endscreen');
    const $arQ      = document.getElementById('ar-q');
    const $arS      = document.getElementById('ar-s');

    /* ── Cargar ejercicio ────────────────────────────── */
    function load(i) {
      answered = false;
      const ex  = EX[i];
      $prog.textContent     = 'EJ ' + (i + 1) + '/10';
      $question.textContent = ex.q;
      $feedback.textContent = '';
      $feedback.className   = '';

      if ($arQ) $arQ.setAttribute('value', ex.q);
      if ($arS) $arS.setAttribute('value', 'Responde abajo');

      // innerHTML con botones HTML simples; onclick inline para evitar
      // problemas de delegación de eventos sobre el canvas de AR.
      $options.innerHTML = ex.opts.map(function(o) {
        // Escapamos comillas simples para no romper el atributo onclick
        var safe = o.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return '<button onclick="pick(this,\'' + safe + '\')">' + o + '</button>';
      }).join('');
    }

    /* ── Procesar respuesta ──────────────────────────── */
    function pick(btn, selected) {
      if (answered) return;
      answered = true;

      var ex      = EX[idx];
      var allBtns = $options.querySelectorAll('button');
      allBtns.forEach(function(b) { b.disabled = true; });

      if (selected === ex.ans) {
        score++;
        btn.classList.add('ok');
        $feedback.textContent = '✦ CORRECTO';
        $feedback.className   = 'ok';
        $score.textContent    = '✦ ' + score;
        if ($arS) $arS.setAttribute('value', '✦ CORRECTO!');
        setTimeout(next, 1400);
      } else {
        btn.classList.add('err');
        $feedback.textContent = '✗ ERA: ' + ex.ans;
        $feedback.className   = 'err';
        if ($arS) $arS.setAttribute('value', 'Era: ' + ex.ans);
        allBtns.forEach(function(b) {
          if (b.textContent.trim() === ex.ans) b.classList.add('ok');
        });
        setTimeout(next, 2000);
      }
    }

    /* ── Avanzar ─────────────────────────────────────── */
    function next() {
      idx++;
      if (idx >= EX.length) {
        $panel.style.display = 'none';
        $hint.style.display  = 'none';
        $end.classList.add('show');
        document.getElementById('finalscore').textContent = 'ACIERTOS: ' + score + ' / 10';
      } else {
        load(idx);
      }
    }

    /* ── Reiniciar ───────────────────────────────────── */
    function restart() {
      idx = 0; score = 0;
      $score.textContent = '✦ 0';
      $end.classList.remove('show');
      $hint.style.display = '';
      load(0);
    }

    /* ── Bind eventos del marcador ───────────────────── */
    function bindMarker() {
      var marker = document.getElementById('hiro');
      if (!marker) { setTimeout(bindMarker, 400); return; }

      marker.addEventListener('markerFound', function() {
        $hint.style.display = 'none';
        if (idx < EX.length) $panel.style.display = '';
      });

      marker.addEventListener('markerLost', function() {
        $panel.style.display = 'none';
        if (idx < EX.length) $hint.style.display = '';
      });
    }

    /* ── Init ────────────────────────────────────────── */
    load(0);

    var scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', bindMarker);
    if (scene.hasLoaded) bindMarker();
  </script>
</body>
</html>

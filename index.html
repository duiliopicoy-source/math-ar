<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR · Ecuaciones de Segundo Grado</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00f5c4;
    --neon2: #7b61ff;
    --danger: #ff4560;
    --warn: #ffd166;
    --bg: #080c14;
    --card: rgba(255,255,255,0.04);
    --border: rgba(0,245,196,0.2);
    --text: #e8f4f0;
    --muted: #6b7c7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,20,0.9);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--neon); }
  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px; padding: 4px 10px;
    border: 1px solid var(--neon);
    border-radius: 20px; color: var(--neon);
    letter-spacing: 1px;
  }

  /* ── LAYOUT ── */
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* ── CAMERA PANEL ── */
  .cam-panel {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    aspect-ratio: 4/3;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.85) saturate(1.1);
  }
  .cam-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 72%; max-width: 280px;
    aspect-ratio: 3/1;
    position: relative;
  }
  .scan-frame::before, .scan-frame::after,
  .scan-frame .corner-bl, .scan-frame .corner-br {
    content: ''; position: absolute;
    width: 22px; height: 22px;
    border-color: var(--neon); border-style: solid;
  }
  .scan-frame::before  { top: 0;    left: 0;  border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .scan-frame::after   { top: 0;    right: 0; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .scan-frame .corner-bl { bottom: 0; left: 0;  border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .scan-frame .corner-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
  .scan-line {
    position: absolute; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    animation: scan 2s linear infinite;
    box-shadow: 0 0 8px var(--neon);
  }
  @keyframes scan { 0%{top:0%} 100%{top:100%} }
  .cam-hint {
    margin-top: 14px;
    font-size: 12px; letter-spacing: 0.5px;
    color: rgba(0,245,196,0.8);
    font-family: 'Space Mono', monospace;
    text-shadow: 0 0 10px var(--neon);
  }
  .cam-inactive {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0d1a2a 0%, #0a1520 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .cam-icon { font-size: 48px; opacity: 0.4; }
  #btn-cam {
    background: var(--neon); color: #000;
    border: none; padding: 10px 24px;
    border-radius: 30px; font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 13px; cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 20px rgba(0,245,196,0.4);
  }
  #btn-cam:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(0,245,196,0.6); }
  .ar-tag {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,245,196,0.15);
    border: 1px solid var(--neon);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 10px; font-family: 'Space Mono', monospace;
    color: var(--neon); letter-spacing: 1px;
    backdrop-filter: blur(6px);
  }

  /* ── PROBLEM SELECTOR ── */
  .section-title {
    font-size: 11px; font-family: 'Space Mono', monospace;
    color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .problem-picker {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .prob-btn {
    flex: 1; min-width: 90px;
    padding: 9px 6px;
    border-radius: 10px;
    border: 1px solid rgba(123,97,255,0.3);
    background: rgba(123,97,255,0.07);
    color: var(--text); font-family: 'Space Mono', monospace;
    font-size: 11px; cursor: pointer;
    transition: all 0.2s; text-align: center;
    line-height: 1.5;
  }
  .prob-btn:hover  { border-color: var(--neon2); background: rgba(123,97,255,0.18); }
  .prob-btn.active { border-color: var(--neon); background: rgba(0,245,196,0.12); color: var(--neon); }

  /* ── EQUATION DISPLAY ── */
  .eq-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative; overflow: hidden;
  }
  .eq-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--neon2), var(--neon));
  }
  .eq-label {
    font-size: 11px; font-family: 'Space Mono', monospace;
    color: var(--muted); letter-spacing: 2px; margin-bottom: 12px;
  }
  .equation {
    font-family: 'Space Mono', monospace;
    font-size: 26px; font-weight: 700;
    color: #fff; letter-spacing: -1px;
    text-align: center;
    text-shadow: 0 0 20px rgba(0,245,196,0.3);
  }
  .equation sup { font-size: 14px; vertical-align: super; }
  .eq-data {
    display: flex; gap: 16px; margin-top: 14px;
    justify-content: center;
  }
  .coef-chip {
    background: rgba(123,97,255,0.15);
    border: 1px solid rgba(123,97,255,0.3);
    border-radius: 8px; padding: 5px 12px;
    font-family: 'Space Mono', monospace; font-size: 12px; color: var(--neon2);
  }
  .coef-chip b { color: #fff; font-weight: 700; }

  /* ── ANSWER BUTTONS ── */
  .answers-wrap { display: flex; flex-direction: column; gap: 10px; }
  .ans-btn {
    padding: 15px 18px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: all 0.2s; text-align: left;
  }
  .ans-btn:hover:not(:disabled) {
    border-color: var(--neon2); background: rgba(123,97,255,0.12);
    transform: translateX(4px);
  }
  .ans-btn .opt-label {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
  }
  .ans-btn.correct {
    border-color: var(--neon); background: rgba(0,245,196,0.12);
    animation: pulse-correct 0.4s ease;
  }
  .ans-btn.correct .opt-label { background: var(--neon); color: #000; border-color: var(--neon); }
  .ans-btn.wrong {
    border-color: var(--danger); background: rgba(255,69,96,0.1);
    animation: shake 0.4s ease;
  }
  .ans-btn.wrong .opt-label { background: var(--danger); color: #fff; border-color: var(--danger); }
  .ans-btn:disabled { cursor: default; }

  @keyframes pulse-correct {
    0%{transform:scale(1)} 40%{transform:scale(1.02)} 100%{transform:scale(1)}
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)}
  }

  /* ── ERROR OVERLAY ── */
  #error-overlay {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8,12,20,0.88);
    backdrop-filter: blur(6px);
    pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #error-overlay.show { opacity: 1; pointer-events: all; }
  .error-box {
    border: 2px solid var(--danger);
    border-radius: 16px;
    padding: 32px 40px;
    text-align: center;
    background: rgba(255,69,96,0.08);
    animation: errorPop 0.3s cubic-bezier(0.3,1.5,0.5,1);
  }
  @keyframes errorPop {
    0%{transform:scale(0.7)} 100%{transform:scale(1)}
  }
  .error-icon { font-size: 52px; margin-bottom: 12px; }
  .error-title {
    font-size: 22px; font-weight: 800; color: var(--danger);
    letter-spacing: -0.5px; margin-bottom: 6px;
  }
  .error-sub { font-size: 14px; color: var(--muted); font-family: 'Space Mono', monospace; }

  /* ── SOLUTION PANEL ── */
  #solution-panel {
    border-radius: var(--radius);
    border: 1px solid rgba(0,245,196,0.4);
    background: linear-gradient(135deg, rgba(0,245,196,0.06) 0%, rgba(123,97,255,0.06) 100%);
    padding: 20px;
    display: none; overflow: hidden;
    animation: slideIn 0.4s ease;
  }
  #solution-panel.show { display: block; }
  @keyframes slideIn {
    from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)}
  }
  .sol-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .sol-icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--neon); color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; flex-shrink: 0;
  }
  .sol-title { font-size: 15px; font-weight: 800; color: var(--neon); }
  .sol-step {
    background: rgba(0,0,0,0.3);
    border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px;
    font-family: 'Space Mono', monospace; font-size: 12px;
    line-height: 1.8; color: #c8ddd9;
    border-left: 2px solid rgba(0,245,196,0.4);
  }
  .sol-step .step-num {
    display: inline-block; color: var(--neon); font-weight: 700; margin-right: 6px;
  }
  .sol-step .formula {
    display: block; text-align: center;
    font-size: 13px; color: #fff;
    margin: 8px 0 4px; letter-spacing: 0.5px;
  }
  .sol-step .highlight {
    color: var(--neon); font-weight: 700;
  }
  .sol-result {
    background: rgba(0,245,196,0.1);
    border: 1px solid rgba(0,245,196,0.4);
    border-radius: 10px; padding: 14px;
    text-align: center; margin-top: 4px;
  }
  .sol-result .roots {
    font-family: 'Space Mono', monospace; font-size: 16px;
    color: #fff; font-weight: 700;
  }
  .sol-result .roots span { color: var(--neon); }
  .btn-next {
    width: 100%; margin-top: 14px;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--neon2);
    background: rgba(123,97,255,0.15);
    color: var(--neon2); font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 14px; cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .btn-next:hover { background: rgba(123,97,255,0.3); transform: scale(1.01); }

  /* ── PROGRESS ── */
  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon2), var(--neon));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .score-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-family: 'Space Mono', monospace; color: var(--muted);
    margin-bottom: 6px;
  }
  .score-row .pts { color: var(--warn); font-weight: 700; }

  /* ── GLOW BG ── */
  body::before {
    content: '';
    position: fixed; top: -200px; right: -200px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,245,196,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; bottom: -200px; left: -200px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(123,97,255,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo">AR<span>·</span>Math</div>
  <div class="badge">2° GRADO</div>
</header>

<div id="error-overlay">
  <div class="error-box">
    <div class="error-icon">✗</div>
    <div class="error-title">Error — inténtalo de nuevo</div>
    <div class="error-sub">Revisa las opciones</div>
  </div>
</div>

<main>

  <!-- SCORE -->
  <div>
    <div class="score-row">
      <span>PROGRESO</span>
      <span class="pts" id="score-txt">0 pts</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <!-- CAMERA -->
  <div class="cam-panel" id="cam-panel">
    <div class="cam-inactive" id="cam-inactive">
      <div class="cam-icon">📷</div>
      <div style="font-size:13px;color:var(--muted);text-align:center;line-height:1.6;">Activa la cámara para<br>modo Realidad Aumentada</div>
      <button id="btn-cam" onclick="startCamera()">Activar cámara AR</button>
    </div>
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <div class="cam-overlay" id="cam-overlay" style="display:none">
      <div class="ar-tag">● AR LIVE</div>
      <div class="scan-frame">
        <div class="scan-line"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
      </div>
      <div class="cam-hint">APUNTA AL PROBLEMA</div>
    </div>
  </div>

  <!-- PROBLEM PICKER -->
  <div>
    <div class="section-title">Selecciona un ejercicio</div>
    <div class="problem-picker" id="problem-picker"></div>
  </div>

  <!-- EQUATION -->
  <div class="eq-card" id="eq-card">
    <div class="eq-label">ECUACIÓN DETECTADA</div>
    <div class="equation" id="eq-display"></div>
    <div class="eq-data" id="eq-coefs"></div>
  </div>

  <!-- ANSWERS -->
  <div>
    <div class="section-title">Elige la respuesta correcta</div>
    <div class="answers-wrap" id="answers-wrap"></div>
  </div>

  <!-- SOLUTION -->
  <div id="solution-panel"></div>

</main>

<script>
const PROBLEMS = [
  { label:'x²-5x+6=0',  a:1, b:-5, c:6,   desc:'x² − 5x + 6 = 0' },
  { label:'x²-x-12=0',  a:1, b:-1, c:-12,  desc:'x² − x − 12 = 0' },
  { label:'2x²+3x-2=0', a:2, b:3,  c:-2,   desc:'2x² + 3x − 2 = 0' },
  { label:'x²-4=0',     a:1, b:0,  c:-4,   desc:'x² − 4 = 0' },
  { label:'3x²-7x+2=0', a:3, b:-7, c:2,    desc:'3x² − 7x + 2 = 0' },
  { label:'x²+6x+9=0',  a:1, b:6,  c:9,    desc:'x² + 6x + 9 = 0' },
];

let current = 0;
let score   = 0;
let answered = false;

function frac(n,d){
  if(d===0) return '∞';
  if(n%d===0) return ''+(n/d);
  function gcd(a,b){return b?gcd(b,a%b):Math.abs(a);}
  const g=gcd(Math.abs(n),Math.abs(d));
  return (d<0?-n/g:n/g)+'/'+(Math.abs(d/g));
}

function solveQuadratic(a,b,c){
  const disc = b*b - 4*a*c;
  if(disc < 0) return {type:'complex', disc};
  if(disc === 0){
    const r = frac(-b, 2*a);
    return {type:'double', x1:r, x2:r, disc, r:-b/(2*a)};
  }
  const sq = Math.sqrt(disc);
  const r1 = (-b + sq)/(2*a);
  const r2 = (-b - sq)/(2*a);
  return {type:'two',
    x1: Number.isInteger(r1)?r1:+r1.toFixed(3),
    x2: Number.isInteger(r2)?r2:+r2.toFixed(3),
    disc, sq:+sq.toFixed(3)
  };
}

function formatRoots(sol){
  if(sol.type==='complex') return '∅ (complejas)';
  if(sol.type==='double')  return `x = ${sol.x1}`;
  return `x₁ = ${sol.x1},  x₂ = ${sol.x2}`;
}

function wrongAnswers(a,b,c,correct){
  const {x1,x2,type} = correct;
  const options = new Set();
  // Correct
  options.add(JSON.stringify(correct));
  const tries = [
    solveQuadratic(a, -b, c),
    solveQuadratic(a, b, -c),
    solveQuadratic(-a, b, c),
    solveQuadratic(a+1, b, c),
    solveQuadratic(a, b+1, c),
  ];
  for(const t of tries){
    if(options.size>=3) break;
    const k = JSON.stringify(t);
    if(!options.has(k)) options.add(k);
  }
  // Ensure 3 distinct
  let i=1;
  while(options.size<3){
    options.add(JSON.stringify({type:'two',x1:x1+i,x2:x2-i,disc:0,sq:0}));
    i++;
  }
  return [...options].map(s=>JSON.parse(s));
}

function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

function loadProblem(idx){
  current = idx; answered = false;
  const p = PROBLEMS[idx];
  const sol = solveQuadratic(p.a, p.b, p.c);

  // Equation display
  document.getElementById('eq-display').innerHTML = p.desc.replace(/²/,'<sup>2</sup>');
  document.getElementById('eq-coefs').innerHTML =
    `<div class="coef-chip">a = <b>${p.a}</b></div>
     <div class="coef-chip">b = <b>${p.b}</b></div>
     <div class="coef-chip">c = <b>${p.c}</b></div>`;

  // Options
  const opts = shuffle(wrongAnswers(p.a,p.b,p.c,sol));
  const correctIdx = opts.findIndex(o=>formatRoots(o)===formatRoots(sol));

  const labels = ['A','B','C'];
  const wrap = document.getElementById('answers-wrap');
  wrap.innerHTML = '';
  opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    const isCorrect = (i === correctIdx);
    btn.dataset.correct = isCorrect;
    btn.innerHTML =
      `<span class="opt-label">${labels[i]}</span>
       <span>${formatRoots(opt)}</span>`;
    btn.onclick = ()=> handleAnswer(btn, isCorrect, sol, p);
    wrap.appendChild(btn);
  });

  // Hide solution
  const sp = document.getElementById('solution-panel');
  sp.className = '';
  sp.innerHTML = '';
  sp.style.display = 'none';
}

let errorTimer = null;
function showError(){
  const ov = document.getElementById('error-overlay');
  ov.classList.add('show');
  clearTimeout(errorTimer);
  errorTimer = setTimeout(()=>ov.classList.remove('show'), 1800);
}

function handleAnswer(btn, isCorrect, sol, p){
  if(answered) return;
  answered = true;
  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b=>b.disabled=true);

  if(isCorrect){
    btn.classList.add('correct');
    score += 10;
    updateScore();
    showSolution(sol, p);
  } else {
    btn.classList.add('wrong');
    answered = false; // allow retry
    allBtns.forEach(b=>b.disabled=false);
    showError();
    // Mark correct one
    allBtns.forEach(b=>{ if(b.dataset.correct==='true') b.style.borderColor='rgba(0,245,196,0.3)'; });
  }
}

function updateScore(){
  document.getElementById('score-txt').textContent = score+' pts';
  const pct = Math.min((score / (PROBLEMS.length*10))*100,100);
  document.getElementById('progress-fill').style.width = pct+'%';
}

function buildSteps(a,b,c,sol){
  const disc = sol.disc;
  const s = String;
  return `
  <div class="sol-step">
    <span class="step-num">1.</span> Identificar coeficientes<br>
    <span class="formula">a = ${a},  b = ${b},  c = ${c}</span>
  </div>
  <div class="sol-step">
    <span class="step-num">2.</span> Fórmula general
    <span class="formula">x = (−b ± √(b²−4ac)) / 2a</span>
  </div>
  <div class="sol-step">
    <span class="step-num">3.</span> Calcular discriminante
    <span class="formula">Δ = (${b})² − 4·(${a})·(${c}) = ${b*b} − ${4*a*c} = <span class="highlight">${disc}</span></span>
    ${disc>0?'<br>Δ > 0 → dos raíces reales distintas':disc===0?'<br>Δ = 0 → raíz doble':'<br>Δ < 0 → raíces complejas'}
  </div>
  ${disc>=0?`<div class="sol-step">
    <span class="step-num">4.</span> Calcular raíces
    <span class="formula">x = (−(${b}) ± √${disc}) / (2·${a})</span>
    <span class="formula">x = (${-b} ± ${sol.sq||0}) / ${2*a}</span>
  </div>`:''}
  <div class="sol-result">
    <div style="font-size:11px;font-family:'Space Mono',monospace;color:var(--muted);margin-bottom:6px;letter-spacing:1px;">SOLUCIÓN</div>
    <div class="roots">${formatRoots(sol).replace(/x₁/,'<span>x₁</span>').replace(/x₂/,'<span>x₂</span>').replace(/x =/,'<span>x</span> =')}</div>
  </div>`;
}

function showSolution(sol, p){
  const sp = document.getElementById('solution-panel');
  sp.innerHTML = `
    <div class="sol-header">
      <div class="sol-icon">✓</div>
      <div class="sol-title">Resolución paso a paso</div>
    </div>
    ${buildSteps(p.a, p.b, p.c, sol)}
    <button class="btn-next" onclick="nextProblem()">Siguiente ejercicio →</button>`;
  sp.style.display = 'block';
  sp.classList.add('show');
  setTimeout(()=>sp.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
}

function nextProblem(){
  const next = (current+1) % PROBLEMS.length;
  // Update picker
  document.querySelectorAll('.prob-btn').forEach((b,i)=>b.classList.toggle('active',i===next));
  loadProblem(next);
  window.scrollTo({top:0,behavior:'smooth'});
}

// Build picker
const picker = document.getElementById('problem-picker');
PROBLEMS.forEach((p,i)=>{
  const b = document.createElement('button');
  b.className = 'prob-btn'+(i===0?' active':'');
  b.textContent = p.label;
  b.onclick = ()=>{
    document.querySelectorAll('.prob-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    loadProblem(i);
  };
  picker.appendChild(b);
});

// Camera
async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('cam-inactive').style.display = 'none';
    document.getElementById('cam-overlay').style.display = 'flex';
  } catch(e){
    alert('No se pudo acceder a la cámara. Asegúrate de dar permisos.');
  }
}

// Init
loadProblem(0);
</script>
</body>
</html>
